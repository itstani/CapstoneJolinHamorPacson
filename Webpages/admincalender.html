<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Calendar</title>
    <link rel="stylesheet" type="text/css" href="/CSS/styles.css" />
    <style>
        /* Reset and general styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            line-height: 1.6;
        }

        /* Top Bar */
        .top-bar {
            background-color: #AF2630;
            position: fixed;
            color: #6b6a6a; 
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 50px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .side-bar {
            background-color: #D9D9D9;
            position: fixed;
            color: #AF2630; 
            top: 50px;
            left: 0;
            width: 110px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
            box-sizing: border-box;
            z-index: 999;
        }

        .side-bar div {
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .side-bar img {
            width: 60px;
            height: 60px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .side-bar img:hover {
            transform: scale(1.1);
        }

        .side-bar p {
            font-size: 15px;
            font-weight: bold;
            font-family: 'Inter';
            margin: 0;
        }

        .mainarea {
            margin-left: 20px; /* Adjusted to align with the sidebar */
            padding: 20px;
            box-sizing: border-box;
        }

        .Home, .homeownerstatus, .analytics, .Calendar {
            margin-bottom: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Inter';
            padding-top: 5px;
        }

        .Home button, .homeownerstatus button, .analytics button, .Calendar button {
            background-color: #D9D9D9;
            margin: 0 auto;
            border: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .Home button:hover, .homeownerstatus button:hover, .analytics button:hover, .Calendar button:hover {
            background-color: #ccc;
            cursor: pointer;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #logoutButton {
            background-color: #AF2630;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: auto;
            margin-bottom: 90px;
            font-weight: bold;
            width: 80%;
        }

        #logoutButton:hover {
            background-color: #C44A53;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-3px);
        }

        /* Calendar Layout */
        .calendar {
            margin: 70px 0 0 110px;
            padding: 20px;
            max-width: calc(100% - 110px);
            color: #AF2630;
        }

        .calendar header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .days-of-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #AF2630;
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day {
            border: 1px solid #AF2630;
            padding: 10px;
            min-height: 100px;
            background-color: #f8f8f8;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .day:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .day:nth-child(7n+1) { background-color: #F4CCCC; }
        .day:nth-child(7n), .day:nth-child(7n-1) { background-color: #EAD1DC; }

        .day.empty {
            border: none;
            background-color: transparent;
        }

        .event-bar {
        background-color: #AF2630; /* Default red color for paid events */
        color: white;
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 0.8rem;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: background-color 0.3s ease;
    }

    .event-bar.unpaid-event {
        background-color: #FFB6C1; /* Light pink for unpaid events */
        color: #AF2630; /* Darker text for better contrast */
    }
    .custom-alert {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 1001; /* Ensure it's above the modal */
      }

      .custom-alert-content {
        text-align: center;
      }

      .custom-alert-header {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #af2630;
      }

      .custom-alert-body {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .custom-alert button {
        background-color: #af2630;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
 

        /* Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .navigation-buttons button {
            background-color: #AF2630;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .navigation-buttons button:hover {
            background-color: white;
            color: #AF2630;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Modal Styling */
        .event-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1100;
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            width: 60%;
            max-width: 600px;
            border-radius: 10px;
            position: relative;
        }

        .modal-header {
            background-color: #AF2630;
            color: white;
            padding: 10px 20px;
            border-radius: 10px 10px 0 0;
            margin: -20px -20px 20px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .modal-flex {
            display: flex;
            gap: 20px;
        }

        .event-details {
            flex: 1;
        }

        .event-image {
            flex-shrink: 0;
            max-width: 300px;
            max-height: 300px;
            overflow: hidden;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .event-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Event List Styling */
        .event-list {
            width: 80%;
            margin: 20px auto;
            padding: 10px;
            border-radius: 10px;
            background-color: #fff;
        }

        .event-list-item {
            cursor: pointer;
            padding: 10px;
            color: #AF2630;
            margin-bottom: 5px;
            background-color: white;
            transition: background-color 0.3s;
            font-weight: bold;
            border: 2px #AF2630 ;
            border-radius: 10px;
       
        }

        .event-list-item:hover {
            background-color: #ead1dc;
            color: #AF2630;
            border: 10px ;
        }

        .eventlistheader {
            color: white;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            background-color: #AF2630;
            border-radius: 10px;
            padding: 2px;
        }

        /* Button Styles */
        .approve-btn, .disapprove-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .approve-btn {
            background-color: #28a745;
        }

        .disapprove-btn {
            background-color: #dc3545;
        }

        .approve-btn:hover, .disapprove-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #disapprovalReason {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }

        .nav-button {
            background-color: #D9D9D9;
            margin: 0 auto;
            border: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            width: 90%;
            padding: 5px;
        }

        .nav-button:hover {
            background-color: #ccc;
            cursor: pointer;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .nav-button img {
            width: 60px;
            height: 60px;
            margin-bottom: 5px;
        }

        .nav-button p {
            font-size: 15px;
            font-weight: bold;
            font-family: 'Inter';
            margin: 0;
            color: #AF2630;
        }

        /* Add these styles to your existing CSS */
        .conflict-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1200;
        }

        .conflict-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            position: relative;
        }

        .conflict-header {
            background-color: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 10px 10px 0 0;
            margin: -20px -20px 20px;
        }

        .conflict-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .conflict-item {
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #dc3545;
            background-color: #fff5f5;
        }

        .conflict-item:last-child {
            margin-bottom: 0;
        }

        .validation-error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .validation-warning {
            color: #ffc107;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="side-bar">
        <div>
            <button type="button" class="nav-button" onclick="window.location.href='AdHome.html'">
                <img src="/images/house.png" alt="Home">
                <p>Home</p>
            </button>
        </div>
        <div>
            <button type="button" class="nav-button" onclick="window.location.href='hotable.html'">
                <img src="/images/Documents.png" alt="Status">
                <p>Status</p>
            </button>
        </div>
        <div>
            <button type="button" class="nav-button" onclick="window.location.href='analytics.html'">
                <img src="/images/Data.png" alt="Analytics">
                <p>Analytics</p>
            </button>
        </div>
        <div>
            <button type="button" class="nav-button" onclick="window.location.href='admincalender.html'">
                <img src="/images/Calendar.png" alt="Calendar">
                <p>Calendar</p>
            </button>
        </div>
        <button id="logoutButton" onclick="handleLogout()">Logout</button>
    </div>

    <div class="calendar">
        <header>
            <h1 id="monthDisplay"></h1>
        </header>
        <div class="days-of-week"></div>
        <div class="days-grid"></div>
        <div class="navigation-buttons">
            <button id="prevMonth">Previous Month</button>
            <button id="nextMonth">Next Month</button>
        </div>
    </div>

    <div id="eventDetails" class="event-modal">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Event Details</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </header>
            <div id="modalContent"></div>
            <div id="modalAmenityDetails"></div>
        </div>
    </div>
    <div id="customAlert" class="custom-alert">
        <div class="custom-alert-content">
          <div class="custom-alert-header">Notice</div>
          <div class="custom-alert-body">
            <p id="customAlertMessage"></p>
            <button onclick="closeCustomAlert()">OK</button>
          </div>
        </div>
      </div>

    <div id="eventList" class="event-list">
        <h2 class="eventlistheader">Pending Events</h2>
        <!-- Pending events will be dynamically inserted here -->
    </div>

    <div id="conflictModal" class="conflict-modal">
        <div class="conflict-content">
            <div class="conflict-header">
                <h2>Schedule Conflict Detected</h2>
            </div>
            <div id="conflictDetails"></div>
            <button class="modal-button" onclick="closeConflictModal()">Close</button>
        </div>
    </div>

    <script src="/client-auth.js"></script>
    <script>
       // Your existing variables
       const monthDisplay = document.getElementById('monthDisplay');
    const daysGrid = document.querySelector('.days-grid');
    const daysOfWeekContainer = document.querySelector('.days-of-week');
    const eventList = document.getElementById('eventList');
    const modal = document.getElementById('eventDetails');
    const modalContent = document.getElementById('modalContent');
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let eventsByDate = {};
    let currentEvents = [];

    const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // Initialize the calendar with Promise.all for concurrent API calls
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            console.log('Initializing calendar...');
            renderDaysOfWeek();
            
            // Use Promise.all to fetch both data sources concurrently
            const [pendingData, approvedData] = await Promise.all([
                fetchPendingEvents(),
                fetchApprovedEvents()
            ]);
            
            // Process pending events
            if (pendingData && pendingData.success) {
                currentEvents = pendingData.events || [];
                displayEventList();
            } else {
                console.error('Failed to load pending events:', pendingData?.message || 'Unknown error');
                eventList.innerHTML = '<h2 class="eventlistheader">Pending Events</h2><p>Failed to load pending events</p>';
            }
            
            // Process approved events
            if (approvedData && approvedData.success) {
                processApprovedEvents(approvedData.events || []);
                renderCalendar();
            } else {
                console.error('Failed to load approved events:', approvedData?.message || 'Unknown error');
            }
        } catch (error) {
            console.error('Error loading events:', error);
            eventList.innerHTML = '<h2 class="eventlistheader">Pending Events</h2><p>Error loading events: ' + error.message + '</p>';
        }
    });

    function showCustomAlert(message) {
        const alertElement = document.getElementById("customAlert");
        const messageElement = document.getElementById("customAlertMessage");
        messageElement.textContent = message;
        alertElement.style.display = "block";
      }

      function closeCustomAlert() {
        const alertElement = document.getElementById("customAlert");
        alertElement.style.display = "none";
      }

    // Process approved events into the calendar format
    function processApprovedEvents(events) {
        eventsByDate = events.reduce((acc, event) => {
            const formattedDate = event.eventDate;
            acc[formattedDate] = acc[formattedDate] || [];
            acc[formattedDate].push({
                name: event.eventName,
                time: `${formatTime(event.startTime)} - ${formatTime(event.endTime)}`,
                amenity: event.amenity,
                isPaid: event.isPaid // This comes from the server's payment status check
            });
            return acc;
        }, {});
    }

    // Improved fetch functions with proper headers and error handling
    async function fetchPendingEvents() {
        try {
            const response = await fetch('/api/pending-events', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin'
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                throw new TypeError("Response was not JSON");
            }

            const data = await response.json();
            console.log('Pending events data:', data);
            return data;
        } catch (error) {
            console.error('Error fetching pending events:', error);
            throw error;
        }
    }


    async function fetchApprovedEvents() {
        try {
            const response = await fetch('/api/approved-events', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin'
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                throw new TypeError("Response was not JSON");
            }

            const data = await response.json();
            console.log('Approved events data:', data);
            return data;
        } catch (error) {
            console.error('Error fetching approved events:', error);
            throw error;
        }
    }

    // Your existing functions
    function renderDaysOfWeek() {
        daysOfWeekContainer.innerHTML = daysOfWeek.map(day => `<div>${day}</div>`).join('');
    }

    function formatTime(time) {
        if (!time) return 'N/A';
        const [hour, minute] = time.split(':');
        const period = hour >= 12 ? 'PM' : 'AM';
        const adjustedHour = hour % 12 || 12;
        return `${adjustedHour}:${minute} ${period}`;
    }

    function renderCalendar() {
        const date = new Date(currentYear, currentMonth, 1);
        monthDisplay.innerText = date.toLocaleString('default', { month: 'long', year: 'numeric' });

        daysGrid.innerHTML = '';
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const startDay = date.getDay();

        // Add empty days for the start of the month
        for (let i = 0; i < startDay; i++) {
            daysGrid.innerHTML += '<div class="day empty"></div>';
        }

        // Add days with events
        for (let i = 1; i <= daysInMonth; i++) {
            const currentDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const events = eventsByDate[currentDate] || [];
            const eventHTML = events.map(event => `
                <div class="event-bar ${!event.isPaid ? 'unpaid-event' : ''}" 
                     title="${event.name} - ${event.time}">
                    ${event.time}
                </div>
            `).join('');

            daysGrid.innerHTML += `
                <div class="day" data-date="${currentDate}">
                    ${i}
                    ${eventHTML}
                </div>
            `;
        }

        addDayClickEvents();
    }

    function addDayClickEvents() {
        document.querySelectorAll('.day:not(.empty)').forEach(day => {
            day.addEventListener('click', () => {
                const date = day.getAttribute('data-date');
                displayEventDetails(date);
            });
        });
    }

    function displayEventDetails(date) {
        const events = eventsByDate[date] || [];
        modalContent.innerHTML = `
            <h3>Events on ${date}</h3>
            ${events.length
                ? events.map(event => `
                    <p>
                        <strong>${event.name}</strong> from ${event.time} at <strong>${event.amenity}</strong>
                        <br>
                        <span style="color: ${event.isPaid ? '#AF2630' : '#FFB6C1'}">
                            Status: ${event.isPaid ? 'Paid' : 'Payment Pending'}
                        </span>
                    </p>
                `).join('')
                : '<p>No events for this day.</p>'}
        `;
        modal.style.display = 'block';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    function displayEventList() {
        if (!currentEvents || currentEvents.length === 0) {
            eventList.innerHTML = `
                <h2 class="eventlistheader">Pending Events</h2>
                <p>No pending events found.</p>
            `;
            return;
        }

        const listContent = currentEvents.map((event, index) => `
            <div class="event-list-item" onclick="displayPendingEventDetails(${index})">
                ${event.eventName} - ${event.eventDate}
            </div>
        `).join('');
        
        eventList.innerHTML = `
            <h2 class="eventlistheader">Pending Events</h2>
            ${listContent}
        `;
    }

    // Add these new validation functions
    function validateEventDetails(event) {
        const errors = [];
        const warnings = [];

        // Validate time slots
        const startTime = new Date(`2000-01-01 ${event.startTime}`);
        const endTime = new Date(`2000-01-01 ${event.endTime}`);
        const duration = (endTime - startTime) / (1000 * 60 * 60); // Duration in hours

        // Check if end time is after start time
        if (endTime <= startTime) {
            errors.push("End time must be after start time");
        }

        // Validate based on amenities
        const amenities = Array.isArray(event.amenities) ? event.amenities : [event.amenity];
        
        amenities.forEach(amenity => {
            switch(amenity) {
                case 'Pool':
                    if (event.poolOptions?.type === 'morning') {
                        if (startTime.getHours() < 6 || endTime.getHours() > 17) {
                            errors.push("Pool morning sessions are only available from 6 AM to 5 PM");
                        }
                    } else {
                        if (startTime.getHours() < 17 || endTime.getHours() > 23) {
                            errors.push("Pool evening sessions are only available from 5 PM to 11 PM");
                        }
                    }
                    if (event.guests?.number > 30) {
                        errors.push("Pool reservations are limited to 30 guests");
                    }
                    break;

                case 'Court':
                    if (startTime.getHours() < 18 || endTime.getHours() > 22) {
                        errors.push("Court is only available from 6 PM to 10 PM");
                    }
                    if (duration > 4) {
                        errors.push("Court reservations are limited to 4 hours");
                    }
                    break;

                case 'Clubhouse':
                    if (startTime.getHours() < 6 || endTime.getHours() > 22) {
                        errors.push("Clubhouse is only available from 6 AM to 10 PM");
                    }
                    if (event.guests?.number > 60) {
                        errors.push("Clubhouse reservations are limited to 60 guests");
                    }
                    break;
            }
        });

        return { errors, warnings };
    }

    function formatEventDetails(event) {
        const amenities = Array.isArray(event.amenities) ? event.amenities : [event.amenity];
        let details = `
            <div class="event-details">
                <h3>${event.eventName}</h3>
                <p><strong>Date:</strong> ${formatDate(event.eventDate)}</p>
                <p><strong>Time:</strong> ${event.startTime} - ${event.endTime}</p>
                <p><strong>Amenities:</strong> ${amenities.join(', ')}</p>
                <p><strong>Guests:</strong> ${event.guests?.number || 0}</p>
        `;

        // Add amenity-specific details
        amenities.forEach(amenity => {
            switch(amenity) {
                case 'Pool':
                    if (event.poolOptions) {
                        details += `<p><strong>Pool Session:</strong> ${event.poolOptions.type}</p>`;
                        if (event.poolOptions.isReserved) {
                            details += `<p><strong>Private Reservation:</strong> Yes</p>`;
                        }
                    }
                    break;

                case 'Court':
                    if (event.courtOptions?.hasLighting) {
                        details += `<p><strong>Court Lighting:</strong> Included</p>`;
                    }
                    break;

                case 'Clubhouse':
                    if (event.clubhouseOptions) {
                        if (event.clubhouseOptions.hasCatering) {
                            details += `<p><strong>Catering Service:</strong> Included</p>`;
                        }
                        if (event.clubhouseOptions.hasSetup) {
                            details += `<p><strong>Setup/Cleanup:</strong> Included</p>`;
                        }
                    }
                    break;
            }
        });

        // Add payment details if available
        if (event.paymentDetails) {
            details += `<div class="payment-details">`;
            details += `<h4>Payment Details:</h4>`;
            event.paymentDetails.forEach(detail => {
                details += `<p>${detail}</p>`;
            });
            details += `<p><strong>Total:</strong> ₱${event.totalPayment}</p>`;
            details += `</div>`;
        }

        details += `</div>`;
        return details;
    }

    function updateEventStatus(eventId, newStatus) {
        fetch('/updateEventStatus', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                eventId,
                status: newStatus
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Refresh the calendar
                calendar.refetchEvents();
                showNotification(`Event ${newStatus} successfully`);
            } else {
                showNotification('Failed to update event status', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showNotification('An error occurred while updating event status', 'error');
        });
    }

    // Initialize FullCalendar
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: '/getEvents',
            eventClick: function(info) {
                const event = info.event;
                const { errors, warnings } = validateEventDetails(event.extendedProps);
                
                let modalContent = formatEventDetails(event.extendedProps);
                
                if (errors.length > 0) {
                    modalContent += `<div class="validation-errors">
                        <h4>Validation Errors:</h4>
                        <ul>${errors.map(error => `<li>${error}</li>`).join('')}</ul>
                    </div>`;
                }
                
                if (warnings.length > 0) {
                    modalContent += `<div class="validation-warnings">
                        <h4>Warnings:</h4>
                        <ul>${warnings.map(warning => `<li>${warning}</li>`).join('')}</ul>
                    </div>`;
                }

                if (event.extendedProps.status === 'pending') {
                    modalContent += `
                        <div class="event-actions">
                            <button onclick="updateEventStatus('${event.id}', 'approved')" class="approve-btn">
                                Approve
                            </button>
                            <button onclick="updateEventStatus('${event.id}', 'rejected')" class="reject-btn">
                                Reject
                            </button>
                        </div>
                    `;
                }

                showModal(modalContent);
            },
            eventDidMount: function(info) {
                // Add status-based styling
                const status = info.event.extendedProps.status;
                info.el.classList.add(`status-${status}`);
            }
        });
        calendar.render();
    });

    document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {
          try {
            const response = await fetch("/logout", { method: "POST" });
            if (response.ok) {
              localStorage.clear(); // Clear user data
              window.location.href = "login.html"; // Redirect to the login page
            } else {
              showCustomAlert("Logout failed. Please try again.");
            }
          } catch (error) {
            console.error("Error during logout:", error);
            showCustomAlert(
              "An error occurred during logout. Please try again."
            );
          }
        });

    // Navigation button event listeners
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentMonth = (currentMonth - 1 + 12) % 12;
        if (currentMonth === 11) currentYear--;
        renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        currentMonth = (currentMonth + 1) % 12;
        if (currentMonth === 0) currentYear++;
        renderCalendar();
    });

    // Modal event listeners
    window.addEventListener('click', (event) => {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            closeModal();
        }
    });

    async function handleLogout() {
        try {
            const response = await fetch("/logout", { method: "POST" });
            if (response.ok) {
                localStorage.clear(); // Clear user data
                window.location.href = "login.html"; // Redirect to the login page
            } else {
                alert("Logout failed. Please try again.");
            }
        } catch (error) {
            console.error("Error during logout:", error);
            alert("An error occurred during logout. Please try again.");
        }
    }

    // Update the conflict display function
    function showConflictModal(conflicts) {
        const conflictModal = document.getElementById('conflictModal');
        const conflictDetails = document.getElementById('conflictDetails');
        
        const conflictsHTML = conflicts.map(conflict => `
            <div class="conflict-item">
                <h3>${conflict.eventName}</h3>
                <p><strong>Amenity:</strong> ${conflict.amenity}</p>
                <p><strong>Time:</strong> ${conflict.startTime} - ${conflict.endTime}</p>
                <p><strong>Host:</strong> ${conflict.HomeownerName}</p>
            </div>
        `).join('');

        conflictDetails.innerHTML = `
            <p>The following events conflict with the requested time slot:</p>
            <div class="conflict-list">
                ${conflictsHTML}
            </div>
            <p class="validation-error">Please choose a different time slot or contact the hosts of conflicting events.</p>
        `;

        conflictModal.style.display = 'block';
    }

    function closeConflictModal() {
        const conflictModal = document.getElementById('conflictModal');
        conflictModal.style.display = 'none';
    }
    </script>
</body>
</html>
