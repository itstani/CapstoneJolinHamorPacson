<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Payment</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f3f3f3;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .payment-container {
        background-color: #ffffff;
        border-radius: 10px;
        padding: 20px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        color: #333;
      }
      h2 {
        color: #af2630;
        text-align: center;
        margin-bottom: 20px;
      }
      .detail {
        margin: 15px 0;
      }
      .detail p {
        margin: 10px 0;
        display: flex;
        justify-content: space-between;
      }
      .detail p strong {
        margin-right: 10px;
      }
      .payment-method {
        margin: 20px 0;
      }
      .payment-method h3 {
        color: #af2630;
        margin-bottom: 10px;
      }
      .payment-method label {
        display: block;
        margin: 10px 0;
        cursor: pointer;
      }
      .payment-method input[type="radio"] {
        margin-right: 10px;
      }
      .qr-container {
        margin: 20px 0;
        text-align: center;
      }
      .qr-container img {
        max-width: 150px;
        height: auto;
      }
      .file-upload {
        margin: 20px 0;
      }
      .file-upload input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .total-amount {
        font-size: 1.2em;
        font-weight: bold;
        margin: 20px 0;
        text-align: right;
      }
      .proceed-button {
        background-color: #af2630;
        color: white;
        border: none;
        padding: 12px 20px;
        width: 100%;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .proceed-button:hover {
        background-color: #8f1d25;
      }
      .proceed-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      .error-message {
        color: #af2630;
        margin-top: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="payment-container">
      <h2>Finalize Your Payment</h2>
      <div class="detail">
        <p><strong>User Email:</strong> <span id="username"></span></p>
        <p><strong>Event Name:</strong> <span id="eventName"></span></p>
        <p><strong>Event Date:</strong> <span id="eventDate"></span></p>
        <p><strong>Start Time:</strong> <span id="eventStartTime"></span></p>
        <p><strong>End Time:</strong> <span id="eventEndTime"></span></p>
        <p><strong>Amenity:</strong> <span id="eventAmenity"></span></p>
        <p><strong>Amount Description:</strong> <span id="baseAmount"></span></p>
        <p><strong>Final Amount:</strong> <span id="finalAmount"></span></p>
    
      </div>

     

      <div class="qr-container">
        <h3>QR Code:</h3>
        <img src="/images/exqrcode.png" alt="QR Code" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiNhYWEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5RUiBDb2RlPC90ZXh0Pjwvc3ZnPg=='" />
      </div>

      <form id="paymentForm" action="/upload-receipt" method="POST" enctype="multipart/form-data">
        <div class="file-upload">
          <input type="file" name="receipt" id="receiptUpload" accept="image/*" required />
        </div>
        
        <p class="total-amount">
          <strong>Total Amount:</strong> ₱<span id="totalAmount">0</span>
        </p>
        
        <input type="hidden" id="finalAmountInput" name="finalAmount" value="0" />
        <input type="hidden" name="username" id="usernameInput" />
        <input type="hidden" name="eventName" id="eventNameInput" />
        <input type="hidden" name="eventDate" id="eventDateInput" />
        <input type="hidden" name="startTime" id="startTimeInput" />
        <input type="hidden" name="endTime" id="endTimeInput" />
        <input type="hidden" name="notificationId" id="notificationIdInput" />
        <input type="hidden" name="eventId" id="eventIdInput" />
        <input type="hidden" name="amount" id="amountInput" value="0" />
        <input type="hidden" name="paymentMethod" id="paymentMethodInput" value="" />
        
        <button type="submit" id="proceedButton" class="proceed-button" disabled>
          Proceed
        </button>
      </form>
    </div>

    <script>
  let fetchedEventDetails = null;

  document.addEventListener('DOMContentLoaded', async function() {
    const eventData = JSON.parse(sessionStorage.getItem('eventData') || '{}');
    const notificationData = JSON.parse(sessionStorage.getItem('notificationData') || '{}');
    console.log('Event data to use:', eventData);
    console.log('Notification data to use:', notificationData);

    if (!eventData || !eventData._id) {
      const container = document.querySelector('.payment-container');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.innerHTML = `
        <h3>Error: Missing Event Information</h3>
        <p>We couldn't find the event details needed for payment.</p>
        <p>Please go back and try again.</p>
        <button onclick="window.location.href='HoHome.html'" class="proceed-button" style="margin-top: 10px;">
          Back to Home
        </button>
      `;
      container.innerHTML = '';
      container.appendChild(errorDiv);
      return;
    }

    try {
      const response = await fetch(`/api/aevents/${eventData._id}`);
      if (!response.ok) throw new Error('Failed to fetch event details');

      // ✅ Assign to global variable
      fetchedEventDetails = await response.json();
      const eventDetails = fetchedEventDetails;

      const totalPayment = eventDetails.event.totalPayment || 0;
      const username = eventDetails.event.username || 'N/A';
      document.getElementById('username').textContent = username;
      document.getElementById('eventName').textContent = eventDetails.event.eventName || 'N/A';
      document.getElementById('eventDate').textContent = eventDetails.event.eventDate || 'N/A';
      document.getElementById('eventStartTime').textContent = eventDetails.event.startTime || 'N/A';
      document.getElementById('eventEndTime').textContent = eventDetails.event.endTime || 'N/A';
      document.getElementById('eventAmenity').textContent = eventDetails.event.amenity || 'N/A';

      if (eventDetails.event.guests && eventDetails.event.guests.number) {
        const guestsElement = document.createElement('p');
        guestsElement.innerHTML = `<strong>Guests:</strong> <span>${eventDetails.event.guests.number}</span>`;
        document.querySelector('.detail').insertBefore(guestsElement, document.getElementById('baseAmount').parentElement);
      }

      let baseAmountText = '';
      let extraFeesText = '';
      let totalAmountText = '';

      if (Array.isArray(eventDetails.event.paymentDetails)) {
        const lines = eventDetails.event.paymentDetails;
        baseAmountText = lines[0] || '';
        extraFeesText = lines.slice(1).join(', ');
      }

      const startTime = new Date(`2000-01-01T${eventDetails.event.startTime}:00`);
      const endTime = new Date(`2000-01-01T${eventDetails.event.endTime}:00`);
      const nightStart = new Date('2000-01-01T18:00:00');
      const nightEnd = new Date('2000-01-01T22:00:00');

      switch (eventDetails.event.amenity) {
        case 'Pool':
          baseAmountText = `₱100 per person`;
          if (startTime < nightEnd && endTime > nightStart) {
            extraFeesText = `₱1000 (Night swimming)`;
            totalAmountText = (100 + 1000).toFixed(2);
          }
          break;
        case 'Court':
          baseAmountText = `₱0 per hour`;
          if (startTime < nightEnd && endTime > nightStart) {
            extraFeesText = `₱300 (Night time)`;
            totalAmountText = (0 + 300).toFixed(2);
          }
          break;
        case 'Clubhouse':
          baseAmountText = `₱1000 per hour`;
          totalAmountText = '1000.00';
          break;
        default:
          baseAmountText = `₱${eventDetails.event.baseAmount.toFixed(2)}`;
      }

      document.getElementById('baseAmount').textContent = baseAmountText;
      document.getElementById('finalAmount').textContent = extraFeesText;
      document.getElementById('totalAmount').textContent = totalAmountText;

      document.getElementById('finalAmountInput').value = totalPayment;
      document.getElementById('eventNameInput').value = eventDetails.event.eventName || '';
      document.getElementById('eventDateInput').value = eventDetails.event.eventDate || '';
      document.getElementById('startTimeInput').value = eventDetails.event.startTime || '';
      document.getElementById('endTimeInput').value = eventDetails.event.endTime || '';
      document.getElementById('notificationIdInput').value = notificationData._id || '';
      document.getElementById('eventIdInput').value = eventData._id || '';
      document.getElementById('amountInput').value = totalAmountText;
      document.getElementById('paymentMethodInput').value = 'YourPaymentMethod';
    } catch (error) {
      console.error('Error fetching event details:', error);
      alert('Error fetching event details. Please try again later.');
    }

    const receiptUpload = document.getElementById('receiptUpload');
    const proceedButton = document.getElementById('proceedButton');
    receiptUpload.addEventListener('change', function() {
      proceedButton.disabled = !this.files.length;
    });

    // ✅ FORM SUBMIT HANDLER
    document.getElementById('paymentForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = new FormData(this);
      try {
        const response = await fetch('/upload-receipt', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.success) {
          const notificationUpdateData = {
            notificationId: notificationData._id,
            eventId: eventData._id,
            eventName: fetchedEventDetails.event.eventName,
            eventDate: fetchedEventDetails.event.eventDate,
            startTime: fetchedEventDetails.event.startTime,
            endTime: fetchedEventDetails.event.endTime
          };

          const notificationResponse = await fetch('/api/updateNotificationAfterPayment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(notificationUpdateData)
          });

          const notificationResult = await notificationResponse.json();
          if (notificationResult.success) {
            alert('Payment processed successfully!');
            sessionStorage.removeItem('eventData');
            sessionStorage.removeItem('notificationData');
            window.location.href = 'HoHome.html';
          } else {
            alert('Payment processed but notification update failed.');
            window.location.href = 'HoHome.html';
          }
        } else {
          alert('Error processing payment.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error processing payment. Please try again.');
      }
    });
  });
  </script>
  </body>
</html>
