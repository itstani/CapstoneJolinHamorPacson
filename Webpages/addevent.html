<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="../CSS/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
      
       * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f5f5f5;
    }

    /* Sidebar and Navigation */
    .side-bar {
        background-color: #D9D9D9;
        position: fixed;
        top: 50px;
        left: 0;
        width: 90px;
        height: 100%;
        padding: 20px 0;
        z-index: 100;
    }

    .Home, .Calendar {
        margin-bottom: 30px;
        text-align: center;
    }

    .Home img, .Calendar img {
        width: 60px;
        height: 60px;
    }

    .Home p, .Calendar p {
        margin-top: 8px;
        color: #AF2630;
        font-size: 14px;
        font-weight: 600;
    }

    .Home button, .Calendar button {
        background: none;
        border: none;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .Home button:hover, .Calendar button:hover {
        transform: scale(1.05);
    }

    /* Main Content */
    .Welcome {
        margin-left: 90px;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .Welcome h1 {
        color: #AF2630;
        font-size: 32px;
        font-weight: bold;
    }

    .avidalogo {
        width: 300px;
        height: auto;
    }

    /* Form Container */
    .form-image-container {
        margin-left: 90px;
        padding: 20px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }

    form {
        background-color: #AF2630;
        padding: 30px;
        border-radius: 12px;
        color: white;
    }

    form h2 {
        font-size: 24px;
        margin-bottom: 25px;
    }

    /* Form Fields */
    form label, form input {
    display: block;
    margin-bottom: 10px;
    width: 100%;
    }
/* Form Fields------------------------------------------------------------ */
    input[type="text"],
    input[type="date"] {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 16px;
        color: #333;
    }

    .guests-container {
    display: flex;
    flex-direction: column;
        margin-bottom: 20px;
}

.guests-input-group {
    display: flex;
        align-items: center;
        gap: 10px;
}

.guests-button {
    padding: 12px 30px;
    background-color: white;
    color: #AF2630;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    }

.guests-button:hover {
    background-color: #c44c57;
    color: white;
}

    #guests {
        text-align: center;
        font-size: 16px;
        padding: 8px;
        border: none;
        background: white;
        border-radius: 8px;
    }

    #guests::-webkit-inner-spin-button,
    #guests::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    #guests {
        -moz-appearance: textfield;
    }

/* Popup container - hidden by default */
.popup-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Transparent background */
    justify-content: center;
    align-items: center;
}

/* Popup content styling */
.popup-content {
    background-color: white;
    padding: 30px; 
    border-radius: 8px;
    border: 2px solid #AF2630;  
    width: 90%;  
    max-width: 800px;  
    height: 100%;  
    max-height: 600px; 
    text-align: center;
    overflow: hidden;
    position: relative;
    display: flex;        
    flex-direction: column;
    justify-content: space-between;
}

/* Red top bar styling */
.popup-header {
    background-color: #AF2630;  
    color: white;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px 8px 0 0; 
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
}

/* Styling for input fields container */
.guest-inputs {
    padding: 10px;
   
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;  
    max-height: 400px;  
    overflow-y: auto;  
    margin-top: 75px;  
    margin-bottom: 1px;  
}



.guest-name {
    padding: 15px;  
    font-size: 16px; 
    border-radius: 5px;
    border: 2px solid #333 !important;  
    color: #333;  
    width: 100%;
}


.close-btn {
    padding: 15px 30px;  
    background-color: #AF2630;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;  
    align-self: center; 
    
    
}

.close-btn:hover {
    background-color: #c44c57;
}



    /* Time Input Styling */
    .time-input-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .time-input-container {
    display: flex;
    align-items: center;
    background: white;
    border-radius: 8px;
    padding: 8px 12px;
    }

    .time-input {
        width: 40px; /* Increased width for better number spacing */
        text-align: center;
        border: none;
        font-size: 16px;
        color: #333;
        padding: .1px;
        margin: 0 2px; /* Added margin for spacing */
    }

    .time-separator {
        margin: 0 4px; /* Increased margin for better spacing */
        color: #333;
        line-height: 1;
    }
    .time-ampm {
        border: none;
        background: none;
        color: #333;
        font-size: 16px;
        padding: 4px 8px;
        cursor: pointer;
    }

    .time-dash {
        color: white;
        font-weight: bold;
        font-size: 20px;
    }

    /* Amenity Selection */
    .amenity {
        margin: 25px 0;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .amenity input[type="radio"] {
        display: none;
    }

    .amenity div {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .amenity label img {
        width: 100px;
        height: 100px;
        border-radius: 10px;
        transition: transform 0.3s, box-shadow 0.3s, border 0.3s;
    }

    .amenity input[type="radio"]:checked + label img {
        transform: scale(1.1);
        border: 3px solid white;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .amenity label:hover img {
        transform: scale(1.1);
        border: 3px solid #f86a73;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    /* Homeowner Status */
    .homeowner {
        display: flex;
        gap: 15px;
        margin: 20px 0;
    }

    .homeowner input[type="radio"] {
        display: none;
    }

    .homeowner label {
        padding: 12px 30px;
        background-color: white;
        color: #AF2630;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
    }

    .homeowner input[type="radio"]:checked + label {
        background-color: #c44c57;
        color: white;
    }

    /* Create Button */
    .create-button {
        width: 100%;
        padding: 15px;
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
    }

    .create-button:hover {
        background-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
    }

    /* Preview Image */
    .amenity-preview {
        width: 100%;
        height: 400px;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid #AF2630;
        margin-top: 20px;
    }

    /* Event Type Containers */
    #eventTypeContainerCB,
    #eventTypeContainerP {
        display: none;
        margin-top: 20px;
    }

    #eventTypeContainerCB select,
    #eventTypeContainerP select {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: #333;
        margin-top: 8px;
    }
    .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    }

    .modal {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .modal-title {
        color: #AF2630;
        font-size: 1.5rem;
        margin-bottom: 1rem;
        font-weight: 600;
    }

    .modal-message {
        color: #333;
        margin-bottom: 1.5rem;
        line-height: 1.5;
    }

    .modal-button {
        background-color: #AF2630;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .modal-button:hover {
        background-color: #8f1f27;
    }
    

    /* Responsive Design */
    @media (max-width: 1024px) {
        .form-image-container {
            grid-template-columns: 1fr;
        }

        .amenity-preview {
            height: 400px;
        }
    }

    @media (max-width: 768px) {
        .Welcome {
            flex-direction: column;
            text-align: center;
            gap: 20px;
        }

        .time-input-group {
            flex-direction: column;
            align-items: stretch;
        }

        .time-input-container {
            justify-content: center;
        }

        .amenity div {
            margin-bottom: 15px;
        }

        .homeowner {
            flex-direction: column;
        }

        .homeowner label {
            text-align: center;
        }
    }

    /* Add these styles */
    .amenity-details {
        margin-top: 8px;
        padding: 12px 10px 8px 10px;
        background: rgba(255,255,255,0.22);
        border-radius: 10px;
        width: 100%;
        color: #222;
        font-size: 15px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .amenity-details strong {
        color: #AF2630;
    }

    .amenity-info {
        color: #222;
        font-size: 14px;
        margin: 4px 0 0 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .amenity-info svg {
        width: 16px;
        height: 16px;
        vertical-align: middle;
    }

    .checkbox-container label {
        color: #AF2630;
        font-size: 15px;
        font-weight: 600;
    }

    .checkbox-container input[type="checkbox"] {
        margin-right: 8px;
    }

    @media (max-width: 900px) {
        .amenity {
            flex-direction: column;
            align-items: stretch;
        }
        .amenity div {
            max-width: 100%;
            min-width: 0;
        }
    }

    .amenity-options {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0 20px 0;
    }
    .option-group {
      margin-bottom: 10px;
    }
    .option-group label {
      display: block;
      margin: 8px 0;
      color: white;
      font-size: 0.95em;
    }
    .option-group input[type="radio"],
    .option-group input[type="checkbox"] {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    
    </div>
  </div> 

  <div class="side-bar">
    <div class="Home">
      <button type="button" id="homebutton" name="homebutton" aria-label="home" onclick="window.location.href='HoHome.html'">
        <img src="/images/house.png" alt="Home">
      </button>
      <p>Home</p>
    </div>

    <div class="Calendar">
      <button type="button" id="calendarbutton" name="calendarbutton" aria-label="calendar" onclick="window.location.href='calender.html'">
        <img src="/images/Calendar.png" alt="calendar">
      </button>
      <p>Calendar</p>
    </div>

  </div>
  

  <div class="Welcome">
    <h1>Add new event</h1>
    <img src="/images/AvidaSettingsLogo.png" alt="Avida Settings Logo" class="avidalogo">
  </div>

  <div class="form-image-container">
    <!-- Form Section -->
    <form id="eventForm" action="/addevent" method="POST">
     
      <h2>New Event Details</h2>
      <input type="hidden" id="username" name="username">
    
    <label for="eventName">Event Name:</label>
    <input type="text" id="eventName" name="eventName" required><br>

    <div class="time-input-group">
      <div class="time-input-container">
          <input type="number" class="time-input" id="eventStartHour" min="1" max="12" placeholder="6">
          <span class="time-separator">:</span>
          <input type="number" class="time-input" id="eventStartMinute" min="0" max="59" placeholder="00">
          <select class="time-ampm" id="eventStartAmPm">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
          </select>
      </div>
      <span class="time-dash">—</span>
      <div class="time-input-container">
          <input type="number" class="time-input" id="eventEndHour" min="1" max="12" placeholder="12" >
          <span class="time-separator">:</span>
          <input type="number" class="time-input" id="eventEndMinute" min="0" max="59" placeholder="00">
          <select class="time-ampm" id="eventEndAmPm" >
              <option value="PM">PM</option>  
              <option value="AM">AM</option>
          </select>
      </div>
  </div>

  
    <label for="date">Date:</label>
      <input type="date" id="date" name="date"><br><br>
  
     <!-- These hidden fields were redundant as values are captured in JS -->
     <!--
      <input type="hidden" id="HomeownerName" name="HomeownerName">
      <input type="hidden" id="eventNameInput" name="eventName">
      <input type="hidden" id="eventDateInput" name="eventDate">
      <input type="hidden" id="eventStartTimeInput" name="eventStartTime">
      <input type="hidden" id="eventEndTimeInput" name="eventEndTime">
      <input type="hidden" id="guestsInput" name="guests">
      <input type="hidden" id="homeownerStatusInput" name="homeownerStatus">
      -->

      <label>Choose an amenity</label>
  
      <div class="amenity">
        <div>
            <input type="radio" id="amenityPool" name="amenity" value="Pool" checked>
            <label for="amenityPool">
                <img src="/images/pool.png" alt="Pool">
            </label>
        </div>
        <div>
            <input type="radio" id="amenityClubhouse" name="amenity" value="Clubhouse">
            <label for="amenityClubhouse">
                <img src="/images/clubhouse.png" alt="Clubhouse">
            </label>
        </div>
        <div>
            <input type="radio" id="amenityCourt" name="amenity" value="Court">
            <label for="amenityCourt">
                <img src="/images/court.png" alt="Court">
            </label>
        </div>
    </div>

      <div id="timeWarning" style="display:none;color:#dc3545;font-weight:600;text-align:center;margin-bottom:10px;"></div>

      <script>
    // Consolidated DOMContentLoaded listener
    document.addEventListener('DOMContentLoaded', async function() {
        console.log("AddEvent DOMContentLoaded");

        // Element Caching
        const eventForm = document.getElementById('eventForm');
        const usernameInput = document.getElementById('username');
        const eventNameInput = document.getElementById('eventName');
        const dateInput = document.getElementById('date');
        const eventStartHourInput = document.getElementById('eventStartHour');
        const eventStartMinuteInput = document.getElementById('eventStartMinute');
        const eventStartAmPmSelect = document.getElementById('eventStartAmPm');
        const eventEndHourInput = document.getElementById('eventEndHour');
        const eventEndMinuteInput = document.getElementById('eventEndMinute');
        const eventEndAmPmSelect = document.getElementById('eventEndAmPm');
        const amenityRadios = document.querySelectorAll('input[name="amenity"]');
        const guestNumberInput = document.getElementById('guestNumber');
        const guestInputsDiv = document.getElementById('guest-inputs');
        const guestPopup = document.getElementById('guest-popup');
        const amenityPreviewImg = document.getElementById('amenityPreview');
        const amenityDetailsContainerDiv = document.getElementById('amenityDetailsContainer');
        const previewImage = document.getElementById('amenityPreview');

        const amenityImages = {
            Pool: '/images/pool.jpg',
            Clubhouse: '/images/clubhouse.jpg',
            Court: '/images/Court.jpg' // Corrected path
        };

        const amenityDetailsConfig = {
            Pool: `
                <div class="amenity-details">
                    <div class="amenity-info" style="font-size:1.1em;margin-bottom:10px;">
                        <strong style="color:#AF2630;">Pool Reservation Details</strong>
                    </div>
                    <div class="amenity-info">• Morning Session: <strong>6AM - 5PM</strong></div>
                    <div class="amenity-info">• Evening Session: <strong>5PM - 11PM</strong> <span style="color:#AF2630;">(+₱1000 for private use)</span></div>
                    <div class="amenity-info">• Base Rate: <strong>₱100</strong> per guest</div>
                    <div class="amenity-info">• Private Reservation Option: <strong>+₱1000</strong> (evening only)</div>
                    <div class="amenity-info">• Maximum Capacity: <strong>30</strong> guests</div>
                </div>`,
            Clubhouse: `
                <div class="amenity-details">
                    <div class="amenity-info" style="font-size:1.1em;margin-bottom:10px;">
                        <strong style="color:#AF2630;">Clubhouse Reservation Details</strong>
                    </div>
                    <div class="amenity-info">• Available Hours: <strong>6AM - 10PM</strong></div>
                    <div class="amenity-info">• Base Rate: <strong>₱1000</strong> per hour</div>
                    <div class="amenity-info">• Catering Service Option: <strong>+₱2000</strong></div>
                    <div class="amenity-info">• Setup/Cleanup Option: <strong>+₱1000</strong></div>
                    <div class="amenity-info">• Maximum Capacity: <strong>60</strong> guests</div>
                </div>`,
            Court: `
                <div class="amenity-details">
                    <div class="amenity-info" style="font-size:1.1em;margin-bottom:10px;">
                        <strong style="color:#AF2630;">Court Reservation Details</strong>
                    </div>
                    <div class="amenity-info">• Available Hours: <strong>6PM - 10PM</strong></div>
                    <div class="amenity-info">• Lighting Fee: <strong>₱300</strong> per hour (included if Court Lighting checked)</div>
                    <div class="amenity-info">• No guest limit (for court usage itself)</div>
                    <div class="amenity-info">• First-come, first-served basis (unless specific booking system implies otherwise)</div>
                </div>`
        };

        // --- Authentication Check ---
        try {
            const authResponse = await fetch('/api/auth-status', {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json', 'Cache-Control': 'no-cache' }
            });
            if (!authResponse.ok) {
                window.location.href = '/login.html';
                return;
            }
            const authData = await authResponse.json();
            if (!authData.authenticated) {
                window.location.href = '/login.html';
                return;
            }
            const username = localStorage.getItem('username');
            if (username && usernameInput) {
                usernameInput.value = username;
            }
        } catch (error) {
            console.error('Auth check failed:', error);
            window.location.href = '/login.html';
            return;
        }


        // --- Amenity Card Click Logic ---
        document.querySelectorAll('.amenity-card').forEach(card => {
            const checkbox = card.querySelector('input[type="checkbox"]');
            card.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') { // Avoid double-toggling if checkbox itself is clicked
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change')); // Trigger change event
                }
            });
            if (checkbox) {
                checkbox.addEventListener('change', function() {
                    card.classList.toggle('selected', checkbox.checked);
                    updateAmenityPreviewAndDetails(); // Update preview and options
                    updateTimeConstraints();
                });
            }
        });

        function getSessionType(startHour24, endHour24, amenity) {
            const poolOptions = { type: '', isReserved: false };
            const courtOptions = { session: '', price: 0 };

            if (amenity === 'Pool') {
                if (startHour24 >= 6 && endHour24 <= 17.99) {
                    poolOptions.type = 'morning';
                } else if (startHour24 >= 17 && endHour24 <= 23) {
                    poolOptions.type = 'night';
                }
                return { poolOptions };
            }

            if (amenity === 'Court') {
                if (startHour24 >= 6 && endHour24 <= 17.99) {
                    courtOptions.session = 'morning';
                    courtOptions.price = 0;
                } else if (startHour24 >= 18 && endHour24 <= 23) {
                    courtOptions.session = 'night';
                    courtOptions.price = 300;
                }
                return { courtOptions };
            }

            return {};
        }


        // --- Time Input Logic ---
        function validateAndFormatTime(hourInput, minuteInput, ampmSelect) {
            let hour = parseInt(hourInput.value);
            let minute = parseInt(minuteInput.value);
            const ampm = ampmSelect.value;

            if (isNaN(hour) || hour < 1 || hour > 12) hour = (ampm === "PM" && hour !== 12) ? 1 : 12; // Default logic might need refinement
            if (isNaN(minute) || minute < 0 || minute > 59) minute = 0;

            hourInput.value = hour;
            minuteInput.value = minute.toString().padStart(2, '0');
            return `${hour}:${minute.toString().padStart(2, '0')} ${ampm}`;
        }
        
        function updateTimeConstraints() {
            const selectedAmenities = Array.from(amenityRadios)
                .filter(rb => rb.checked)
                .map(rb => rb.value);

            // Reset general constraints first
            [eventStartHourInput, eventEndHourInput].forEach(input => { input.min = '1'; input.max = '12'; });
            // More specific constraints will be applied below

            let timeWarning = "";

            if (selectedAmenities.includes('Pool')) {
                const poolType = document.querySelector('input[name="poolType"]:checked')?.value || 'morning';
                if (poolType === 'morning') { // 6 AM to 5 PM
                    timeWarning = "Pool Morning: 6 AM - 5 PM";
                } else { // Evening 5 PM to 11 PM
                    timeWarning = "Pool Evening: 5 PM - 11 PM";
                }
            } else if (selectedAmenities.includes('Court')) { // 6 PM to 10 PM
                timeWarning = "Court: 6 PM - 10 PM";
            } else if (selectedAmenities.includes('Clubhouse')) { // 6 AM to 10 PM
                timeWarning = "Clubhouse: 6 AM - 10 PM";
            }
            
            const timeWarningDiv = document.getElementById('timeWarning');
            if (timeWarningDiv) {
                timeWarningDiv.textContent = timeWarning;
                timeWarningDiv.style.display = timeWarning ? 'block' : 'none';
            }
        }

        [eventStartHourInput, eventStartMinuteInput, eventStartAmPmSelect, eventEndHourInput, eventEndMinuteInput, eventEndAmPmSelect].forEach(el => {
            if (el) el.addEventListener('change', updateTimeConstraints);
        });


        // --- Guest List Popup Logic ---
        window.openPopup = function() { // Make it global for inline HTML onclick
            if (!guestNumberInput || !guestInputsDiv || !guestPopup) return;

  <script>
    // Find the time input elements and validate they exist
const eventStartHour = document.getElementById('eventStartHour');
const eventStartMinute = document.getElementById('eventStartMinute');
const eventStartAmPm = document.getElementById('eventStartAmPm');
const eventEndHour = document.getElementById('eventEndHour');
const eventEndMinute = document.getElementById('eventEndMinute');
const eventEndAmPm = document.getElementById('eventEndAmPm');

// Ensure all elements exist before adding event listeners
if (eventStartHour && eventStartMinute && eventStartAmPm && 
    eventEndHour && eventEndMinute && eventEndAmPm) {
    
    // Function to validate and adjust time
    function validateTime(hour, minute, ampm) {
        if (ampm === 'AM' && (hour < 8 || (hour === 12))) {
            return { hour: 8, minute: 0, ampm: 'AM' };
        }
        return { hour, minute, ampm };
    }

// Add event listeners to all start time inputs
[eventStartHour, eventStartMinute, eventStartAmPm].forEach(element => {
        element.addEventListener('change', function() {
            const validatedTime = validateTime(
                parseInt(eventStartHour.value) || 8,
                parseInt(eventStartMinute.value) || 0,
                eventStartAmPm.value
            );
            
            eventStartHour.value = validatedTime.hour;
            eventStartMinute.value = validatedTime.minute < 10 ? '0' + validatedTime.minute : validatedTime.minute;
            eventStartAmPm.value = validatedTime.ampm;
            
            updateEndTime();
        });
});

// Function to update end time based on start time
function updateEndTime() {
        let startHour = parseInt(eventStartHour.value) || 8;
    let startMinute = parseInt(eventStartMinute.value) || 0;
    let startAmPm = eventStartAmPm.value;
    
    // Calculate end time (1 hour later)
    let endHour = startHour;
    let endMinute = startMinute;
    let endAmPm = startAmPm;
    
    // Add 1 hour
    endHour += 1;
    
    // Handle hour overflow
    if (endHour > 12) {
        endHour = endHour - 12;
        // Toggle AM/PM if we cross 12
        if (startHour === 12) {
            endAmPm = startAmPm === 'AM' ? 'PM' : 'AM';
        }
    }
    
    // Handle special case of 11 AM/PM to 12 PM/AM
    if (startHour === 11) {
        endAmPm = startAmPm === 'AM' ? 'PM' : 'AM';
    }
    
    // Update end time fields
    eventEndHour.value = endHour;
    eventEndMinute.value = startMinute < 10 ? '0' + startMinute : startMinute;
    eventEndAmPm.value = endAmPm;
}
}

// Guest list handling
function openPopup() {
    const guestNumber = document.getElementById('guestNumber');
    const guestInputsDiv = document.getElementById('guest-inputs');
    
    if (!guestNumber || !guestInputsDiv) {
        console.error('Required elements not found');
        return;
    }

    const numberOfGuests = parseInt(guestNumber.value) || 0;

    // Validate number of guests
    if (numberOfGuests < 1 || numberOfGuests > 30) {
        alert('Please enter a valid number of guests (1-30)');
        guestNumber.value = '1';
        return;
    }
    
    // Clear existing inputs
    guestInputsDiv.innerHTML = '';
    
    // Create input fields based on the number entered
    for (let i = 0; i < numberOfGuests; i++) {
        const inputField = document.createElement('input');
        inputField.type = 'text';
        inputField.className = 'guest-name';
        inputField.placeholder = `Guest ${i + 1}`;
        inputField.required = true;
        guestInputsDiv.appendChild(inputField);
    }
    
    // Show the popup
    const popup = document.getElementById('guest-popup');
    if (popup) {
        popup.style.display = 'flex';
    }
}

// Close popup function
function closePopup() {
    const popup = document.getElementById('guest-popup');
    if (popup) {
        popup.style.display = 'none';
    }
}
