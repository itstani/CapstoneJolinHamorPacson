<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="../CSS/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
      
       * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f5f5f5;
    }

    /* Sidebar and Navigation */
    .side-bar {
        background-color: #D9D9D9;
        position: fixed;
        top: 50px;
        left: 0;
        width: 90px;
        height: 100%;
        padding: 20px 0;
        z-index: 100;
    }

    .Home, .Calendar {
        margin-bottom: 30px;
        text-align: center;
    }

    .Home img, .Calendar img {
        width: 60px;
        height: 60px;
    }

    .Home p, .Calendar p {
        margin-top: 8px;
        color: #AF2630;
        font-size: 14px;
        font-weight: 600;
    }

    .Home button, .Calendar button {
        background: none;
        border: none;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .Home button:hover, .Calendar button:hover {
        transform: scale(1.05);
    }

    /* Main Content */
    .Welcome {
        margin-left: 90px;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .Welcome h1 {
        color: #AF2630;
        font-size: 32px;
        font-weight: bold;
    }

    .avidalogo {
        width: 300px;
        height: auto;
    }

    /* Form Container */
    .form-image-container {
        margin-left: 90px;
        padding: 20px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }

    form {
        background-color: #AF2630;
        padding: 30px;
        border-radius: 12px;
        color: white;
    }

    form h2 {
        font-size: 24px;
        margin-bottom: 25px;
    }

    /* Form Fields */
    form label, form input {
    display: block;
    margin-bottom: 10px;
    width: 100%;
    }
/* Form Fields------------------------------------------------------------ */
    input[type="text"],
    input[type="date"] {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 16px;
        color: #333;
    }

    .guests-container {
    display: flex;
    flex-direction: column;
        margin-bottom: 20px;
}

.guests-input-group {
    display: flex;
        align-items: center;
        gap: 10px;
}

.guests-button {
    padding: 12px 30px;
    background-color: white;
    color: #AF2630;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    }

.guests-button:hover {
    background-color: #c44c57;
    color: white;
}

    #guests {
        text-align: center;
        font-size: 16px;
        padding: 8px;
        border: none;
        background: white;
        border-radius: 8px;
    }

    #guests::-webkit-inner-spin-button,
    #guests::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    #guests {
        -moz-appearance: textfield;
    }

/* Popup container - hidden by default */
.popup-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Transparent background */
    justify-content: center;
    align-items: center;
}

/* Popup content styling */
.popup-content {
    background-color: white;
    padding: 30px; 
    border-radius: 8px;
    border: 2px solid #AF2630;  
    width: 90%;  
    max-width: 800px;  
    height: 100%;  
    max-height: 600px; 
    text-align: center;
    overflow: hidden;
    position: relative;
    display: flex;        
    flex-direction: column;
    justify-content: space-between;
}

/* Red top bar styling */
.popup-header {
    background-color: #AF2630;  
    color: white;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px 8px 0 0; 
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
}

/* Styling for input fields container */
.guest-inputs {
    padding: 10px;
   
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;  
    max-height: 400px;  
    overflow-y: auto;  
    margin-top: 75px;  
    margin-bottom: 1px;  
}



.guest-name {
    padding: 15px;  
    font-size: 16px; 
    border-radius: 5px;
    border: 2px solid #333 !important;  
    color: #333;  
    width: 100%;
}


.close-btn {
    padding: 15px 30px;  
    background-color: #AF2630;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;  
    align-self: center; 
    
    
}

.close-btn:hover {
    background-color: #c44c57;
}



    /* Time Input Styling */
    .time-input-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .time-input-container {
    display: flex;
    align-items: center;
    background: white;
    border-radius: 8px;
    padding: 8px 12px;
    }

    .time-input {
        width: 40px; /* Increased width for better number spacing */
        text-align: center;
        border: none;
        font-size: 16px;
        color: #333;
        padding: .1px;
        margin: 0 2px; /* Added margin for spacing */
    }

    .time-separator {
        margin: 0 4px; /* Increased margin for better spacing */
        color: #333;
        line-height: 1;
    }
    .time-ampm {
        border: none;
        background: none;
        color: #333;
        font-size: 16px;
        padding: 4px 8px;
        cursor: pointer;
    }

    .time-dash {
        color: white;
        font-weight: bold;
        font-size: 20px;
    }

    /* Amenity Selection */
    .amenities {
        margin: 25px 0;
        display: flex;
        gap: 24px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
    }
    .amenity-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
        background: rgba(255,255,255,0.15);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        padding: 18px 16px 10px 16px;
        transition: box-shadow 0.2s, transform 0.2s, border 0.2s;
        min-width: 220px;
        max-width: 260px;
        cursor: pointer;
        border: 2px solid transparent;
        position: relative;
    }
    .amenity-card.selected {
        border: 2px solid #AF2630;
        box-shadow: 0 6px 18px rgba(175,38,48,0.18);
        transform: translateY(-4px) scale(1.03);
    }
    .amenity-card input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }
    .amenity-card .custom-checkbox {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 22px;
        height: 22px;
        background: #fff;
        border: 2px solid #AF2630;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }
    .amenity-card.selected .custom-checkbox {
        background: #AF2630;
    }
    .amenity-card .custom-checkbox svg {
        display: none;
    }
    .amenity-card.selected .custom-checkbox svg {
        display: block;
        color: #fff;
    }

    .amenities div {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
        background: rgba(255,255,255,0.15);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        padding: 18px 16px 10px 16px;
        transition: box-shadow 0.2s, transform 0.2s;
        min-width: 220px;
        max-width: 260px;
    }

    .amenities div:hover {
        box-shadow: 0 6px 18px rgba(175,38,48,0.18);
        transform: translateY(-4px) scale(1.03);
    }

    .amenities label img {
        width: 110px;
        height: 110px;
        border-radius: 12px;
        margin-bottom: 8px;
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .amenities input[type="radio"]:checked + label img {
       transform: scale(1.1); /* Enlarge the button when selected */
       border: 3px solid white; /* Add border on hover */
       box-shadow: 0 0 15px rgba(0, 0, 0, 0.3); /* Add shadow */
    }
    .amenities label:hover img {
        transform: scale(1.1); /* Enlarge the button */
        border: 3px solid #f86a73; /* Add border on hover */
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.3); /* Add shadow */
      }
      
    /* Homeowner Status */
    .homeowner {
        display: flex;
        gap: 15px;
        margin: 20px 0;
    }

    .homeowner input[type="radio"] {
        display: none;
    }

    .homeowner label {
        padding: 12px 30px;
        background-color: white;
        color: #AF2630;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
    }

    .homeowner input[type="radio"]:checked + label {
        background-color: #c44c57;
        color: white;
    }

    /* Create Button */
    .create-button {
        width: 100%;
        padding: 15px;
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
    }

    .create-button:hover {
        background-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
    }

    /* Preview Image */
    .amenity-preview {
        width: 100%;
        height: 400px;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid #AF2630;
        margin-top: 20px;
    }

    /* Event Type Containers */
    #eventTypeContainerCB,
    #eventTypeContainerP {
        display: none;
        margin-top: 20px;
    }

    #eventTypeContainerCB select,
    #eventTypeContainerP select {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: #333;
        margin-top: 8px;
    }
    .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    }

    .modal {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .modal-title {
        color: #AF2630;
        font-size: 1.5rem;
        margin-bottom: 1rem;
        font-weight: 600;
    }

    .modal-message {
        color: #333;
        margin-bottom: 1.5rem;
        line-height: 1.5;
    }

    .modal-button {
        background-color: #AF2630;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .modal-button:hover {
        background-color: #8f1f27;
    }
    

    /* Responsive Design */
    @media (max-width: 1024px) {
        .form-image-container {
            grid-template-columns: 1fr;
        }

        .amenity-preview {
            height: 400px;
        }
    }

    @media (max-width: 768px) {
        .Welcome {
            flex-direction: column;
            text-align: center;
            gap: 20px;
        }

        .time-input-group {
            flex-direction: column;
            align-items: stretch;
        }

        .time-input-container {
            justify-content: center;
        }

        .amenities div {
            margin-bottom: 15px;
        }

        .homeowner {
            flex-direction: column;
        }

        .homeowner label {
            text-align: center;
        }
    }

    /* Add these styles */
    .amenity-details {
        margin-top: 8px;
        padding: 12px 10px 8px 10px;
        background: rgba(255,255,255,0.22);
        border-radius: 10px;
        width: 100%;
        color: #222;
        font-size: 15px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .amenity-details strong {
        color: #AF2630;
    }

    .amenity-info {
        color: #222;
        font-size: 14px;
        margin: 4px 0 0 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .amenity-info svg {
        width: 16px;
        height: 16px;
        vertical-align: middle;
    }

    .checkbox-container label {
        color: #AF2630;
        font-size: 15px;
        font-weight: 600;
    }

    .checkbox-container input[type="checkbox"] {
        margin-right: 8px;
    }

    @media (max-width: 900px) {
        .amenities {
            flex-direction: column;
            align-items: stretch;
        }
        .amenities div {
            max-width: 100%;
            min-width: 0;
        }
    }

    .amenity-options {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0 20px 0;
    }
    .option-group {
      margin-bottom: 10px;
    }
    .option-group label {
      display: block;
      margin: 8px 0;
      color: white;
      font-size: 0.95em;
    }
    .option-group input[type="radio"],
    .option-group input[type="checkbox"] {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    
    </div>
  </div> 

  <div class="side-bar">
    <div class="Home">
      <button type="button" id="homebutton" name="homebutton" aria-label="home" onclick="window.location.href='HoHome.html'">
        <img src="/images/house.png" alt="Home">
      </button>
      <p>Home</p>
    </div>

    <div class="Calendar">
      <button type="button" id="calendarbutton" name="calendarbutton" aria-label="calendar" onclick="window.location.href='calender.html'">
        <img src="/images/Calendar.png" alt="calendar">
      </button>
      <p>Calendar</p>
    </div>

  </div>
  

  <div class="Welcome">
    <h1>Add new event</h1>
    <img src="/images/AvidaSettingsLogo.png" alt="Avida Settings Logo" class="avidalogo">
  </div>

  <div class="form-image-container">
    <!-- Form Section -->
    <form id="eventForm" action="/addevent" method="POST">
     
      <h2>New Event Details</h2>
      <input type="hidden" id="username" name="username">
    <input type="hidden" id="email" name="email">
    
    <label for="eventName">Event Name:</label>
    <input type="text" id="eventName" name="eventName" required><br>

    <div class="time-input-group">
      <div class="time-input-container">
          <input type="number" class="time-input" id="eventStartHour" min="1" max="12" placeholder="1">
          <span class="time-separator">:</span>
          <input type="number" class="time-input" id="eventStartMinute" min="0" max="59" placeholder="00">
          <select class="time-ampm" id="eventStartAmPm">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
          </select>
      </div>
      <span class="time-dash">—</span>
      <div class="time-input-container">
          <input type="number" class="time-input" id="eventEndHour" min="1" max="12" placeholder="12" >
          <span class="time-separator">:</span>
          <input type="number" class="time-input" id="eventEndMinute" min="0" max="59" placeholder="00">
          <select class="time-ampm" id="eventEndAmPm" >
              <option value="PM">PM</option>  
              <option value="AM">AM</option>
          </select>
      </div>
  </div>

  
    <label for="date">Date:</label>
      <input type="date" id="date" name="date"><br><br>
  
      <input type="hidden" id="HomeownerName" name="HomeownerName">
      <input type="hidden" id="eventName" name="eventName">
      <input type="hidden" id="eventDate" name="eventDate">
      <input type="hidden" id="eventStartTime" name="eventStartTime">
      <input type="hidden" id="eventEndTime" name="eventEndTime">
      <input type="hidden" id="guests" name="guests">
      <input type="hidden" id="homeownerStatus" name="homeownerStatus">

      <label>Choose an amenity</label>
  
      <div class="amenities">
        <div class="amenity-card" id="cardPool">
            <input type="checkbox" id="amenityPool" name="amenities" value="Pool">
            <span class="custom-checkbox">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M5 10.5L9 14.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <label for="amenityPool" style="cursor:pointer;">
                <img src="../images/pool.png" alt="Pool">
            </label>
        </div>
        <div class="amenity-card" id="cardClubhouse">
            <input type="checkbox" id="amenityClubhouse" name="amenities" value="Clubhouse">
            <span class="custom-checkbox">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M5 10.5L9 14.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <label for="amenityClubhouse" style="cursor:pointer;">
                <img src="../images/clubhouse.png" alt="Clubhouse">
            </label>
        </div>
        <div class="amenity-card" id="cardCourt">
            <input type="checkbox" id="amenityCourt" name="amenities" value="Court">
            <span class="custom-checkbox">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M5 10.5L9 14.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <label for="amenityCourt" style="cursor:pointer;">
                <img src="../images/court.png" alt="Court">
            </label>
        </div>
      </div>

      <!-- Add amenity options containers -->
      <div id="poolOptions" class="amenity-options" style="display: none;">
        <div class="option-group">
          <label>
            <input type="radio" name="poolType" value="morning" checked> Morning Session (6AM - 5PM)
          </label>
          <label>
            <input type="radio" name="poolType" value="evening"> Evening Session (5PM - 11PM) +₱1000
          </label>
        </div>
        <div class="option-group">
          <label>
            <input type="checkbox" id="poolReservation" name="poolReservation"> Reserve for Private Use (+₱1000)
          </label>
        </div>
      </div>

      <div id="courtOptions" class="amenity-options" style="display: none;">
        <div class="option-group">
          <label>
            <input type="checkbox" id="courtLighting" name="courtLighting" checked> Include Lighting Fee (₱300/hour)
          </label>
        </div>
      </div>

      <div id="clubhouseOptions" class="amenity-options" style="display: none;">
        <div class="option-group">
          <label>
            <input type="checkbox" id="clubhouseCatering" name="clubhouseCatering"> Include Catering Service (+₱2000)
          </label>
        </div>
        <div class="option-group">
          <label>
            <input type="checkbox" id="clubhouseSetup" name="clubhouseSetup"> Include Setup/Cleanup Service (+₱1000)
          </label>
        </div>
      </div>

      <div id="timeWarning" style="display:none;color:#dc3545;font-weight:600;text-align:center;margin-bottom:10px;"></div>

      <script>
        // Amenity card click logic
        document.querySelectorAll('.amenity-card').forEach(card => {
            const checkbox = card.querySelector('input[type="checkbox"]');
            const details = card.querySelector('.amenity-details');
            card.addEventListener('click', function(e) {
                // Only toggle if not clicking the checkbox directly
                if (e.target.tagName !== 'INPUT') {
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change'));
                }
            });
            checkbox.addEventListener('change', function() {
                card.classList.toggle('selected', checkbox.checked);
                if (details) details.style.display = checkbox.checked ? 'block' : 'none';
            });
        });

        // Update the amenity selection handlers
        document.addEventListener('DOMContentLoaded', function() {
            const amenityCheckboxes = document.querySelectorAll('input[name="amenities"]');
            
            amenityCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const detailsId = this.id.replace('amenity', '') + 'Details';
                    const detailsElement = document.getElementById(detailsId);
                    
                    if (detailsElement) {
                        detailsElement.style.display = this.checked ? 'block' : 'none';
                    }

                    // Update time constraints based on selection
                    updateTimeConstraints();
                });
            });

            // Add handler for pool night checkbox
            const poolNightCheckbox = document.getElementById('poolNight');
            if (poolNightCheckbox) {
                poolNightCheckbox.addEventListener('change', function() {
                    updateTimeConstraints();
                });
            }
        });

        // Update time constraints function
        function updateTimeConstraints() {
            const selectedAmenities = Array.from(document.querySelectorAll('input[name="amenities"]:checked'))
                .map(cb => cb.value);
            
            const isPoolNight = document.getElementById('poolNight')?.checked;
            
            // Reset time inputs
            eventStartHour.value = '';
            eventStartMinute.value = '';
            eventEndHour.value = '';
            eventEndMinute.value = '';

            if (selectedAmenities.includes('Pool')) {
                if (isPoolNight) {
                    // Evening pool hours (5PM - 11PM)
                    eventStartHour.min = '5';
                    eventStartHour.max = '10';
                    eventEndHour.min = '6';
                    eventEndHour.max = '11';
                } else {
                    // Morning pool hours (6AM - 5PM)
                    eventStartHour.min = '6';
                    eventStartHour.max = '4';
                    eventEndHour.min = '7';
                    eventEndHour.max = '5';
                }
            } else if (selectedAmenities.includes('Court')) {
                // Court hours (6PM - 10PM)
                eventStartHour.min = '6';
                eventStartHour.max = '9';
                eventEndHour.min = '7';
                eventEndHour.max = '10';
            } else if (selectedAmenities.includes('Clubhouse')) {
                // Clubhouse hours (6AM - 10PM)
                eventStartHour.min = '6';
                eventStartHour.max = '9';
                eventEndHour.min = '7';
                eventEndHour.max = '10';
            }
        }

        // Add authentication check at page load
        document.addEventListener('DOMContentLoaded', async function() {
          try {
            const response = await fetch('/api/auth-status', {
              method: 'GET',
              credentials: 'include',
              headers: {
                'Accept': 'application/json',
                'Cache-Control': 'no-cache'
              }
            });

            if (!response.ok) {

if (eventStartHour && eventStartMinute && eventStartAmPm &&

    // Function to validate and adjust time
    function validateTime(hour, minute, ampm) {
        if (ampm === 'AM' && (hour < 8 || (hour === 12))) {
            return { hour: 8, minute: 0, ampm: 'AM' };
        }
        return { hour, minute, ampm };
    }

// Add event listeners to all start time inputs
[eventStartHour, eventStartMinute, eventStartAmPm].forEach(element => {
        element.addEventListener('change', function() {
            const validatedTime = validateTime(
                parseInt(eventStartHour.value) || 8,
                parseInt(eventStartMinute.value) || 0,
                eventStartAmPm.value
            );
            
            eventStartHour.value = validatedTime.hour;
            eventStartMinute.value = validatedTime.minute < 10 ? '0' + validatedTime.minute : validatedTime.minute;
            eventStartAmPm.value = validatedTime.ampm;
            
            updateEndTime();
        });
});

// Function to update end time based on start time
function updateEndTime() {
        let startHour = parseInt(eventStartHour.value) || 8;
    let startMinute = parseInt(eventStartMinute.value) || 0;
    let startAmPm = eventStartAmPm.value;
    
    // Calculate end time (1 hour later)
    let endHour = startHour;
    let endMinute = startMinute;
    let endAmPm = startAmPm;
    
    // Add 1 hour
    endHour += 1;
    
    // Handle hour overflow
    if (endHour > 12) {
        endHour = endHour - 12;
        // Toggle AM/PM if we cross 12
        if (startHour === 12) {
            endAmPm = startAmPm === 'AM' ? 'PM' : 'AM';
        }
    }
    
    // Handle special case of 11 AM/PM to 12 PM/AM
    if (startHour === 11) {
        endAmPm = startAmPm === 'AM' ? 'PM' : 'AM';
    }
    
    // Update end time fields
    eventEndHour.value = endHour;
    eventEndMinute.value = startMinute < 10 ? '0' + startMinute : startMinute;
    eventEndAmPm.value = endAmPm;
}
}

    // Function to update time constraints based on selected amenities
    function updateTimeConstraints() {
        const selectedAmenities = Array.from(amenityCheckboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        // Reset time inputs
        eventStartHour.value = '';
        eventStartMinute.value = '';
        eventEndHour.value = '';
        eventEndMinute.value = '';

        // Apply constraints based on selected amenities
        if (selectedAmenities.includes('Court')) {
            // Court is evening only (6PM-10PM)
            eventStartHour.min = '6';
            eventStartHour.max = '9';
            eventEndHour.min = '7';
            eventEndHour.max = '10';
        } else if (selectedAmenities.includes('Pool')) {
            const poolType = document.getElementById('poolType').value;
            if (poolType === 'morning') {
                eventStartHour.min = '6';
                eventStartHour.max = '4';
                eventEndHour.min = '7';
                eventEndHour.max = '5';
            } else {
                eventStartHour.min = '5';
                eventStartHour.max = '10';
                eventEndHour.min = '6';
                eventEndHour.max = '11';
            }
        } else if (selectedAmenities.includes('Clubhouse')) {
            eventStartHour.min = '6';
            eventStartHour.max = '9';
            eventEndHour.min = '7';
            eventEndHour.max = '10';
        }
    }

    // Function to update payment calculations
    function updatePayments() {
        const selectedAmenities = Array.from(amenityCheckboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        let totalPayment = 0;
        const paymentDetails = {};

        selectedAmenities.forEach(amenity => {
            switch(amenity) {
                case 'Pool':
                    const poolType = document.getElementById('poolType').value;
                    const guestCount = parseInt(guestNumber.value) || 0;
                    const basePayment = guestCount * 100;
                    const eveningFee = poolType === 'evening' ? 1000 : 0;
                    totalPayment += basePayment + eveningFee;
                    paymentDetails.pool = {
                        basePayment,
                        eveningFee,
                        total: basePayment + eveningFee
                    };
                    break;

                case 'Court':
                    const courtHours = calculateHours();
                    const courtTotal = courtHours * 300;
                    totalPayment += courtTotal;
                    paymentDetails.court = {
                        hours: courtHours,
                        total: courtTotal
                    };
                    break;

                case 'Clubhouse':
                    const clubhouseHours = calculateHours();
                    const hasCatering = document.getElementById('clubhouseCatering').checked;
                    const hasSetup = document.getElementById('clubhouseSetup').checked;
                    
                    amenityCost = clubhouseHours * config.basePrice;
                    if (hasCatering) amenityCost += config.cateringFee;
                    if (hasSetup) amenityCost += config.setupFee;
                    
                    amenityDetails.push(`${clubhouseHours} hours × ₱${config.basePrice}`);
                    if (hasCatering) amenityDetails.push('Catering service +₱2000');
                    if (hasSetup) amenityDetails.push('Setup/Cleanup +₱1000');
                    break;
            }
        });

        return { totalPayment, paymentDetails };
    }

    // Function to calculate hours between start and end time
    function calculateHours() {
        const startHour = parseInt(eventStartHour.value) || 0;
        const endHour = parseInt(eventEndHour.value) || 0;
        let hours = endHour - startHour;
        if (hours < 0) hours += 12; // Handle AM/PM transition
        return Math.max(1, hours); // Minimum 1 hour
    }

    // Add event listeners for amenity selection
    amenityCheckboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const amenity = this.value;
            switch(amenity) {
                case 'Pool':
                    poolOptions.style.display = this.checked ? 'block' : 'none';
                    break;
                case 'Court':
                    courtOptions.style.display = this.checked ? 'block' : 'none';
                    guestListButton.style.display = this.checked ? 'none' : 'block';
                    break;
                case 'Clubhouse':
                    clubhouseOptions.style.display = this.checked ? 'block' : 'none';
                    break;
            }
            updateTimeConstraints();
            updatePayments();
        });
    });

    // Update form submission to handle multiple amenities
    const form = document.getElementById('eventForm');
    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const selectedAmenities = Array.from(amenityCheckboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        if (selectedAmenities.length === 0) {
            alert('Please select at least one amenity');
            return;
        }

        const { totalPayment, paymentDetails } = updatePayments();
        const formData = {
            amenities: selectedAmenities,
            paymentDetails,
            totalPayment,
            // ... rest of your existing form data ...
        };

        try {
            const response = await fetch('/addevent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            if (result.success) {
                showSuccessModal();
            } else {
                alert(result.message || 'Failed to create event');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while creating the event');
        }
    });

      <div class="amenity-info">Evening: <strong>5PM - 11PM</strong> <span style="color:#AF2630;">(+₱1000 fee)</span></div>
      <div class="amenity-info">₱100 per guest</div>
      <div class="amenity-info">Max 30 guests</div>
      <div class="amenity-info">Shared use, no reservation needed for morning</div>
    </div>
  `,
  Clubhouse: `
    <div class="amenity-details">
      <div class="amenity-info">Available: <strong>6AM - 10PM</strong></div>
      <div class="amenity-info">₱1000 per hour</div>
      <div class="amenity-info">Max 60 guests</div>
      <div class="amenity-info">Normal reservation only</div>
    </div>
  `,
  Court: `
    <div class="amenity-details">
      <div class="amenity-info">Available: <strong>6PM - 10PM</strong></div>
      <div class="amenity-info">₱300 per hour (lighting fee)</div>
      <div class="amenity-info">No guest limit</div>
      <div class="amenity-info">Lighting fee applies after 6PM</div>
    </div>
  `
};
const amenityImages = {
  Pool: '/images/pool.jpg',
  Clubhouse: '/images/clubhouse.jpg',
  Court: '/images/Court.jpg'
};
function updateAmenityPreviewAndDetails() {
  const checked = Array.from(document.querySelectorAll('input[name="amenities"]:checked'));
  let show = checked.length ? checked[checked.length-1].value : null;
  if (!show) show = 'Pool'; // default
  amenityPreview.src = amenityImages[show];
  amenityPreview.alt = show + ' Preview';
  amenityDetailsContainer.innerHTML = amenityDetails[show];
}
document.querySelectorAll('input[name="amenities"]').forEach(cb => {
  cb.addEventListener('change', updateAmenityPreviewAndDetails);
});
// Initial load
updateAmenityPreviewAndDetails();
</script>
<div id="customAlert" class="custom-alert">
  <div class="custom-alert-content">
      <div class="custom-alert-header">Notice</div>
      <div class="custom-alert-body">
          <p id="customAlertMessage"></p>
          <button onclick="closeCustomAlert()">OK</button>
      </div>
  </div>
</div>
