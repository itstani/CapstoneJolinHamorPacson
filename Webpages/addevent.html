<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="../CSS/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
      
       * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f5f5f5;
    }

    /* Sidebar and Navigation */
    .side-bar {
        background-color: #D9D9D9;
        position: fixed;
        top: 50px;
        left: 0;
        width: 90px;
        height: 100%;
        padding: 20px 0;
        z-index: 100;
    }

    .Home, .Calendar {
        margin-bottom: 30px;
        text-align: center;
    }

    .Home img, .Calendar img {
        width: 60px;
        height: 60px;
    }

    .Home p, .Calendar p {
        margin-top: 8px;
        color: #AF2630;
        font-size: 14px;
        font-weight: 600;
    }

    .Home button, .Calendar button {
        background: none;
        border: none;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .Home button:hover, .Calendar button:hover {
        transform: scale(1.05);
    }

    /* Main Content */
    .Welcome {
        margin-left: 90px;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .Welcome h1 {
        color: #AF2630;
        font-size: 32px;
        font-weight: bold;
    }

    .avidalogo {
        width: 300px;
        height: auto;
    }

    /* Form Container */
    .form-image-container {
        margin-left: 90px;
        padding: 20px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }

    form {
        background-color: #AF2630;
        padding: 30px;
        border-radius: 12px;
        color: white;
    }

    form h2 {
        font-size: 24px;
        margin-bottom: 25px;
    }

    /* Form Fields */
    form label, form input {
    display: block;
    margin-bottom: 10px;
    width: 100%;
    }
/* Form Fields------------------------------------------------------------ */
    input[type="text"],
    input[type="date"] {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 16px;
        color: #333;
    }

    .guests-container {
    display: flex;
    flex-direction: column;
        margin-bottom: 20px;
}

.guests-input-group {
    display: flex;
        align-items: center;
        gap: 10px;
}

.guests-button {
    padding: 12px 30px;
    background-color: white;
    color: #AF2630;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    }

.guests-button:hover {
    background-color: #c44c57;
    color: white;
}

    #guests {

        font-size: 16px;
        padding: 8px;
        border: none;
        background: white;
        border-radius: 8px;
    }

        -webkit-appearance: none;

    }

    }

/* Popup container - hidden by default */
.popup-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Transparent background */
    justify-content: center;
    align-items: center;
}

/* Popup content styling */
.popup-content {
    background-color: white;
    padding: 30px; 
    border-radius: 8px;
    border: 2px solid #AF2630;  
    width: 90%;  
    max-width: 800px;  
    height: 100%;  
    max-height: 600px; 
    text-align: center;
    overflow: hidden;
    position: relative;
    display: flex;        
    flex-direction: column;
    justify-content: space-between;
}

/* Red top bar styling */
.popup-header {
    background-color: #AF2630;  
    color: white;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px 8px 0 0;

    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
}

/* Styling for input fields container */
.guest-inputs {
    padding: 10px;

    grid-template-columns: 1fr 1fr;
    gap: 12px;  
    max-height: 400px;  
    overflow-y: auto;

}



.guest-name {

.close-btn {

    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;  
    align-self: center; 
    
    
}

.close-btn:hover {

}



    /* Time Input Styling */

    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal {

    /* Responsive Design */

        }
    }
  </style>

  <script>
    // Find the time input elements and validate they exist
const eventStartHour = document.getElementById('eventStartHour');
const eventStartMinute = document.getElementById('eventStartMinute');
const eventStartAmPm = document.getElementById('eventStartAmPm');
const eventEndHour = document.getElementById('eventEndHour');
const eventEndMinute = document.getElementById('eventEndMinute');
const eventEndAmPm = document.getElementById('eventEndAmPm');

// Ensure all elements exist before adding event listeners
if (eventStartHour && eventStartMinute && eventStartAmPm && 
    eventEndHour && eventEndMinute && eventEndAmPm) {
    
    // Function to validate and adjust time
    function validateTime(hour, minute, ampm) {
        if (ampm === 'AM' && (hour < 8 || (hour === 12))) {
            return { hour: 8, minute: 0, ampm: 'AM' };
        }
        return { hour, minute, ampm };
    }

// Add event listeners to all start time inputs
[eventStartHour, eventStartMinute, eventStartAmPm].forEach(element => {
        element.addEventListener('change', function() {
            const validatedTime = validateTime(
                parseInt(eventStartHour.value) || 8,
                parseInt(eventStartMinute.value) || 0,
                eventStartAmPm.value
            );
            
            eventStartHour.value = validatedTime.hour;
            eventStartMinute.value = validatedTime.minute < 10 ? '0' + validatedTime.minute : validatedTime.minute;
            eventStartAmPm.value = validatedTime.ampm;
            
            updateEndTime();
        });
});

// Function to update end time based on start time
function updateEndTime() {
        let startHour = parseInt(eventStartHour.value) || 8;
    let startMinute = parseInt(eventStartMinute.value) || 0;
    let startAmPm = eventStartAmPm.value;
    
    // Calculate end time (1 hour later)
    let endHour = startHour;
    let endMinute = startMinute;
    let endAmPm = startAmPm;
    
    // Add 1 hour
    endHour += 1;
    
    // Handle hour overflow
    if (endHour > 12) {
        endHour = endHour - 12;
        // Toggle AM/PM if we cross 12
        if (startHour === 12) {
            endAmPm = startAmPm === 'AM' ? 'PM' : 'AM';
        }
    }
    
    // Handle special case of 11 AM/PM to 12 PM/AM
    if (startHour === 11) {
        endAmPm = startAmPm === 'AM' ? 'PM' : 'AM';
    }
    
    // Update end time fields
    eventEndHour.value = endHour;
    eventEndMinute.value = startMinute < 10 ? '0' + startMinute : startMinute;
    eventEndAmPm.value = endAmPm;
}
}

// Guest list handling
function openPopup() {
    const guestNumber = document.getElementById('guestNumber');
    const guestInputsDiv = document.getElementById('guest-inputs');
    
    if (!guestNumber || !guestInputsDiv) {
        console.error('Required elements not found');
        return;
    }

    const numberOfGuests = parseInt(guestNumber.value) || 0;

    // Validate number of guests
    if (numberOfGuests < 1 || numberOfGuests > 30) {
        alert('Please enter a valid number of guests (1-30)');
        guestNumber.value = '1';
        return;
    }
    
    // Clear existing inputs
    guestInputsDiv.innerHTML = '';
    
    // Create input fields based on the number entered
    for (let i = 0; i < numberOfGuests; i++) {
        const inputField = document.createElement('input');
        inputField.type = 'text';
        inputField.className = 'guest-name';
        inputField.placeholder = `Guest ${i + 1}`;
        inputField.required = true;
        guestInputsDiv.appendChild(inputField);
    }
    
    // Show the popup
    const popup = document.getElementById('guest-popup');
    if (popup) {
        popup.style.display = 'flex';
    }
}

// Close popup function
function closePopup() {
    const popup = document.getElementById('guest-popup');
    if (popup) {
        popup.style.display = 'none';
    }
}

// Initialize all functionality when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    // Initialize time fields
    if (eventStartHour && eventStartMinute && eventStartAmPm) {
        eventStartHour.value = '8';
        eventStartMinute.value = '00';
        eventStartAmPm.value = 'AM';
        updateEndTime();
    }

    // Add event listeners for amenity selection
    const amenityInputs = document.querySelectorAll('input[name="amenity"]');
    const previewImage = document.getElementById('amenityPreview');
    
    // Function to update preview image
    function updatePreviewImage(amenityValue) {
        const imagePaths = {
            'Pool': '/images/poolimg.PNG',
            'Clubhouse': '/images/clubhouseimg.jpg',
            'Court': '/images/Courtimg.jpg'
        };
        
        if (previewImage) {
            previewImage.src = imagePaths[amenityValue] || '/images/poolimg.PNG';
            previewImage.alt = `${amenityValue} Preview`;
        }
    }

    // Add change event listeners to radio buttons
    amenityInputs.forEach(input => {
        input.addEventListener('change', function() {
            updatePreviewImage(this.value);
        });
    });

    // Set initial preview image
    const defaultAmenity = document.querySelector('input[name="amenity"]:checked');
    if (defaultAmenity) {
        updatePreviewImage(defaultAmenity.value);
    }

    // Initialize guest number input validation
    const guestNumber = document.getElementById('guestNumber');
    if (guestNumber) {
        guestNumber.addEventListener('input', function() {
            let value = parseInt(this.value) || 1;
            if (value > 30) value = 30;
            if (value < 1) value = 1;
            this.value = value;
        });
    }

    // Form submission handling
    const form = document.getElementById('eventForm');
    if (form) {
        form.addEventListener('submit', async function(event) {
    event.preventDefault();

     // Collect guest names from the popup input fields
     const guestNames = [];
    const guestInputs = document.querySelectorAll('.guest-name');
    guestInputs.forEach(input => {
        if (input.value.trim() !== '') {
            guestNames.push(input.value.trim());
        }
    });

    const formData = {
                HomeownerName: document.getElementById('HomeownerName')?.value || '',
                eventName: document.getElementById('eventName')?.value || '',
                eventDate: document.getElementById('date')?.value || '',
                startTime: `${eventStartHour?.value || '8'}:${eventStartMinute?.value || '00'} ${eventStartAmPm?.value || 'AM'}`,
                endTime: `${eventEndHour?.value || '9'}:${eventEndMinute?.value || '00'} ${eventEndAmPm?.value || 'AM'}`,
                amenity: document.querySelector('input[name="amenity"]:checked')?.value || '',
        eventType: document.getElementById('eventType')?.value || '',
                guests: {
                    number: parseInt(document.getElementById('guestNumber')?.value || '1'),
                    names: guestNames
                },
        homeownerStatus: document.querySelector('input[name="homeownerStatus"]:checked')?.value || ''
    };

    try {
        const response = await fetch('/addevent', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
            showSuccessModal();
        } else {
            alert(result.message || 'Failed to create event. Please try again.');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
    }
});

    // Load user email if available
            const userEmail = localStorage.getItem('email');
    if (userEmail) {
        const userEmailInput = document.getElementById('userEmail');
        if (userEmailInput) {
            userEmailInput.value = userEmail;
        }
            }
        });

// Modal functions
function showSuccessModal() {
    const modal = document.getElementById('successModal');
    if (modal) {
        modal.style.display = 'flex';
    }
}

function closeSuccessModal() {
    const modal = document.getElementById('successModal');
    if (modal) {
        modal.style.display = 'none';
    }
    window.location.href = 'HoHome.html';
}

function showCustomAlert(message) {
    const alertElement = document.getElementById('customAlert');
    const messageElement = document.getElementById('customAlertMessage');
    if (alertElement && messageElement) {
        messageElement.textContent = message;
        alertElement.style.display = 'block';
}
}

function closeCustomAlert() {
    const alertElement = document.getElementById('customAlert');
    if (alertElement) {
        alertElement.style.display = 'none';
}
}
</script>
<div id="customAlert" class="custom-alert">
  <div class="custom-alert-content">
      <div class="custom-alert-header">Notice</div>
      <div class="custom-alert-body">
          <p id="customAlertMessage"></p>
          <button onclick="closeCustomAlert()">OK</button>
      </div>
  </div>
</div>
