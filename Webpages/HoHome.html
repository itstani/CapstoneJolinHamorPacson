      }
 
      .reserve button {

        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
 
      .reserve button:hover {

  <script>
  let notifications = [];
  const MAX_RETRIES = 3;
  const RETRY_DELAY = 2000;
  let retryCount = 0;
  let currentNotification = null;

  async function fetchNotifications() {
    try {
      console.log("Starting to fetch notifications...");
      const response = await fetch("/api/notifications", {
        method: "GET",
        credentials: "include",
        headers: {
          "Accept": "application/json",
          "Cache-Control": "no-cache"
        }
      });

      console.log("Notification fetch response status:", response.status);
      
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }

      const data = await response.json();
      console.log("Raw notification data:", data);
      
      if (data && data.success) {
        notifications = data.notifications || [];
        console.log("Processed notifications:", notifications);
        
        const unreadCount = data.unreadCount || 0;
        console.log("Unread count:", unreadCount);
        
        const notificationCountEl = document.getElementById('notificationCount');
        if (notificationCountEl) {
          notificationCountEl.textContent = unreadCount.toString();
          console.log("Updated notification count display");
        } else {
          console.error("Notification count element not found");
        }
        
        updateNotificationList();
        updateClearButtons();
      } else {
        console.error("Invalid notification data received:", data);
        notifications = [];
        updateNotificationList();
        updateClearButtons();
      }
    } catch (error) {
      console.error("Error fetching notifications:", error);
      showErrorMessage("Failed to load notifications. Please try again.");
      notifications = [];
      updateNotificationList();
      updateClearButtons();
    }
  }

  function updateNotificationList() {
  console.log("Updating notification list");
  const notificationList = document.getElementById('notificationList');
  if (!notificationList) {
    console.error('Notification list element not found');
      return; // Buttons not found
    }
    
  notificationList.innerHTML = ''; // Clear existing list

  if (!notifications || notifications.length === 0) {
    console.log("No notifications to display");
    const noNotifications = document.createElement('div');
    noNotifications.classList.add('no-notifications');
    noNotifications.textContent = 'No new notifications';
    notificationList.appendChild(noNotifications);
      return;
    }
    
  console.log("Rendering notifications:", notifications);

  notifications.forEach((notification) => {

    contentWrapper.appendChild(subjectDiv);
    contentWrapper.appendChild(messageDiv);
    contentWrapper.appendChild(timestampDiv);

    // Add elements to notification item
    notificationItem.appendChild(checkbox);
    notificationItem.appendChild(contentWrapper);

    // Add click event
    notificationItem.addEventListener('click', (e) => {
      markNotificationAsRead(notification._id);
      console.log("Notification clicked:", notification);
      if (e.target !== checkbox) {
        switch (notification.type) {
          case 'eventPaymentRequired':
            showEventPaymentRequiredModal({
              ...notification,
              button: {
                text: 'Proceed to Event Payment',
              }
            });
            break;
          case 'payment_reminder':
            showPaymentReminderModal(notification);
            break;
          case 'payment_required':
            showDefaultModal({
              ...notification,
              message: "Your monthly dues are due, please pay them at your earliest convenience.",
              button: {
                text: 'Proceed to Payment',
              }
            });
            break;
          case 'payment_approved':
            showPaymentApprovedModal(notification);
            break;

          case 'eventPayment_confirmed':
            showEventPaymentConfirmedModal(notification);
            break;
          default:
            showDefaultModal(notification);
        }
      }
    });

  });

function convert24HourTo12HourFormat(timeStr) {
  if (!timeStr) return "";
  const [hours, minutes] = timeStr.split(':');
  const h = parseInt(hours, 10);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hour12 = h % 12 || 12;
  return `${hour12}:${minutes} ${ampm}`;
}


function showEventPaymentConfirmedModal(notification) {
  console.log("Fetching event details for modal:", notification);

  const eventId = notification.relatedId;
  if (!eventId) {
    alert("No event ID provided for this notification.");
    return;
  }

  fetch(`/api/aevents/${eventId}`)
    .then(res => res.json())
    .then(data => {
      if (!data.success || !data.event) {
        throw new Error("Event not found");
      }

      const event = data.event;

      // Create modal container
      const modal = document.createElement('div');
      modal.classList.add('event-details-modal');
      modal.style.display = 'flex';
      modal.style.justifyContent = 'center';
      modal.style.alignItems = 'center';
      modal.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';

      // Modal content
      const modalContent = document.createElement('div');
      modalContent.className = 'event-details-content';

      // Close button
      const closeButton = document.createElement('span');
      closeButton.className = 'close-event-details';
      closeButton.innerHTML = '&times;';
      closeButton.onclick = () => {
        modal.style.display = 'none';
        document.body.removeChild(modal);
      };

      // Title
      const title = document.createElement('h3');
      title.id = 'eventDetailsTitle';
      title.textContent = 'Event Payment Confirmed';

      modalContent.appendChild(closeButton);
      modalContent.appendChild(title);

      // Event details rows
      const details = [
        { label: 'Event Name:', value: event.eventName || 'N/A' },
        { label: 'Event Date:', value: event.eventDate || 'N/A' },
        { label: 'Time:', value: `${convert24HourTo12HourFormat(event.startTime)} - ${convert24HourTo12HourFormat(event.endTime)}` },
        { label: 'Amenity:', value: event.amenity || 'N/A' },
        { label: 'Amount Paid:', value: `₱${event.totalPayment || '0.00'}` },
        { label: 'Payment Date:', value: new Date(notification.timestamp?.$date || Date.now()).toLocaleString() },
      ];

      details.forEach(detail => {
        const row = document.createElement('div');
        row.className = 'event-detail-row';

        const label = document.createElement('div');
        label.className = 'event-detail-label';
        label.textContent = detail.label;

        const value = document.createElement('div');
        value.className = 'event-detail-value';
        value.textContent = detail.value;

        row.appendChild(label);
        row.appendChild(value);
        modalContent.appendChild(row);
      });

      // Optional: Receipt image
      if (notification.receiptImage) {
        const receiptImage = document.createElement('img');
        receiptImage.src = notification.receiptImage;
        receiptImage.alt = 'Receipt Image';
        receiptImage.style.maxWidth = '100%';
        receiptImage.style.marginTop = '10px';
        modalContent.appendChild(receiptImage);
      }

      modal.appendChild(modalContent);
      document.body.appendChild(modal);
    })
    .catch(err => {
      console.error("Error fetching event details:", err);
      alert("Failed to load event details. Please try again later.");
    });
}

// Function to clear selected notifications
async function clearSelectedNotifications() {
  console.log("Clearing selected notifications");
  try {
    const checkboxes = document.querySelectorAll('.notification-checkbox:checked');
    if (checkboxes.length === 0) {
      console.log("No notifications selected");
      return;
    }

    const selectedIds = Array.from(checkboxes).map(checkbox => checkbox.dataset.id);
    console.log("Selected notification IDs:", selectedIds);

    const response = await fetch('/api/clearSelectedNotifications', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ notificationIds: selectedIds })
    });

    if (response.ok) {
      const result = await response.json();
      if (result.success) {
        // Remove the cleared notifications from the array
        notifications = notifications.filter(notification => 
          !selectedIds.includes(notification._id)
        );
        
        // Update the notification count
        const notificationCount = document.getElementById('notificationCount');
        if (notificationCount) {
          notificationCount.textContent = notifications.length.toString();
        }
        
        // Update the UI
        updateNotificationList();
        updateClearButtons();
      }
    }
  } catch (error) {
    console.error('Error clearing selected notifications:', error);
    showErrorMessage('Failed to clear selected notifications. Please try again.');
  }
}

  async function fetchHomeownerPaymentDetails() {
    try {
      const response = await fetch('/api/homeowner-payment-details');
      if (!response.ok) throw new Error('Failed to fetch homeowner payment details');

      const data = await response.json();
      console.log('Fetched homeowner payment details:', data);

      if (data && data.success) {
        const { lastPaymentDate, paymentStatus, MDAmount } = data;

        // Display the fetched data
        document.getElementById('lastPaymentDate').textContent = new Date(lastPaymentDate).toLocaleString();
        document.getElementById('paymentStatus').textContent = paymentStatus;
        document.getElementById('MDAmount').textContent = `₱${(MDAmount || 0).toFixed(2)}`;
      } else {
        console.error('Invalid data received:', data);
      }
    } catch (error) {
      console.error('Error fetching homeowner payment details:', error);
    }
  }

  // Call the function to fetch and display the payment details
  fetchHomeownerPaymentDetails();
