    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Reserve Section in Columns */
      .reserve {
        display: flex;
        justify-content: center; /* Centers content horizontally */
        gap: 20%; /* Space between the buttons */
        text-align: center;
        flex-wrap: wrap; /* Allows buttons to wrap on smaller screens */

      .reservetext1 {
        font-size: 40px;
        font-family: "Inter";
        color: #3e0408;
        font-weight: bold;
        margin-top: 10px;

        width: 100%; /* Ensure the text takes up full width */

      .reserve-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
 
      .reserve button {
        border: 2px solid #3e0408;
        background: transparent;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
 
      .reserve button:hover {
        background-color: #3e0408;
        color: #ffffff;
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

        height: 300px;

        margin-top: 10px;
        padding-top: 20px;
      }

  <script>
let notifications = [];
const MAX_RETRIES = 3;
const RETRY_DELAY = 2000;
let retryCount = 0;
let currentNotification = null;

// Function to update the notification list in the UI - defined first since it's used by multiple functions
function updateNotificationList() {
  const notificationList = document.getElementById('notificationList');
  if (!notificationList) {
    console.error('Notification list element not found');
    return;
  }

  notificationList.innerHTML = ''; // Clear existing list

  if (!notifications || notifications.length === 0) {
    const noNotifications = document.createElement('div');
    noNotifications.classList.add('no-notifications');
    noNotifications.textContent = 'No new notifications';
    notificationList.appendChild(noNotifications);
    return;
  }

  notifications.forEach((notification) => {
    // Skip deleted event notifications
    if (notification.type === 'event_deleted') {
      return;
    }

    const notificationItem = document.createElement('div');
    notificationItem.classList.add('notification-item');
    notificationItem.dataset.id = notification._id;
    
    // Create checkbox
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'notification-checkbox';
    checkbox.dataset.id = notification._id;
    checkbox.onclick = (e) => e.stopPropagation(); // Prevent opening modal when clicking checkbox

    // Create content wrapper
    const contentWrapper = document.createElement('div');
    contentWrapper.className = 'notification-content';
    
    // Create subject line
    const subjectDiv = document.createElement('div');
    subjectDiv.className = 'notification-subject';
    
    // Format the subject line based on notification type
    let subject = '';
    if (notification.type === 'monthly_payment' || notification.type === 'payment_approved' || notification.type === 'payment_rejected') {
      subject = `Monthly Payment ${notification.type === 'payment_approved' ? 'Approved' : notification.type === 'payment_rejected' ? 'Rejected' : 'Submitted'}`;
    } else if (notification.type === 'concern' || notification.type === 'new_concern' || notification.type === 'concern_reply') {
      subject = notification.subject || 'Concern Update';
    } else if (notification.type === 'payment_required' || notification.type === 'payment_confirmed' || notification.type === 'event_confirmed') {
      subject = notification.subject || `${notification.eventName || 'Event'} on ${notification.eventDate || 'N/A'}`;
    } else {
      subject = notification.subject || notification.message;
    }

// Function to mark a notification as read
async function markNotificationAsRead(notificationId) {
  try {
    const response = await fetch('/api/markNotificationAsRead', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ notificationId })
    });
    
    if (response.ok) {
      // Update the local notification object
      const index = notifications.findIndex(n => n._id === notificationId);
      if (index !== -1) {
        notifications[index].read = true;
        
        // Update the notification count
        const unreadCount = notifications.filter(n => !n.read).length;
        const notificationCountElement = document.getElementById('notificationCount');
        if (notificationCountElement) {
          notificationCountElement.textContent = unreadCount.toString();
        }
      }
    } else {
      console.error('Server returned error when marking notification as read');
    }
  } catch (error) {
    console.error('Error marking notification as read:', error);
  }
}

// Function to mark all notifications as read
async function markAllNotificationsAsRead() {
  try {
    const response = await fetch('/api/markAllNotificationsRead', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      }
    });
    
    if (response.ok) {
      // Update all local notification objects
      notifications.forEach(notification => {
        notification.read = true;
      });
      
      // Update the notification count
      const notificationCountElement = document.getElementById('notificationCount');
      if (notificationCountElement) {
        notificationCountElement.textContent = '0';
      }
    }
  } catch (error) {
    console.error('Error marking all notifications as read:', error);
  }
}

    if (match && match[1]) {

    } else if (notification.subject) {

      if (subjectParts.length > 0) {
        displayEventName = subjectParts[0];
      }

  }
  document.getElementById('eventDetailsName').textContent = displayEventName;

  // Extract date
  let displayDate = notification.eventDate || 'N/A';
  if (!displayDate || displayDate === 'N/A') {
    if (notification.subject) {
      const dateMatch = notification.subject.match(/on\s+(\d{4}-\d{2}-\d{2})/);
      if (dateMatch && dateMatch[1]) {
        displayDate = dateMatch[1];
      }
    }
    if ((!displayDate || displayDate === 'N/A') && notification.message) {
      const dateMatch = notification.message.match(/(\d{4}-\d{2}-\d{2})/);
      if (dateMatch && dateMatch[1]) {
        displayDate = dateMatch[1];
      }
    }
  }
  document.getElementById('eventDetailsDate').textContent = displayDate;

  // Extract time
  let displayTime = 'N/A';
  
  // First check direct properties
  if (notification.startTime && notification.endTime) {
    displayTime = `${notification.startTime} - ${notification.endTime}`;
  } 
  // Then check subject - specifically for the format in your data
  else if (notification.subject && notification.subject.includes('PM-')) {
    // Handle the specific format in your data like "Liga on 2025-03-20 4: PM-6: PM"
    const timeMatch = notification.subject.match(/(\d+:\s*PM)-(\d+:\s*PM)/i);
    if (timeMatch && timeMatch[1] && timeMatch[2]) {
      displayTime = `${timeMatch[1].trim()} - ${timeMatch[2].trim()}`;
    }
  }
  // Try other patterns if still not found
  else if (notification.subject) {
    const timeMatch = notification.subject.match(/(\d{1,2}:\d{2}(?:\s*[AP]M)?)\s*-\s*(\d{1,2}:\d{2}(?:\s*[AP]M)?)/i);
    if (timeMatch && timeMatch[1] && timeMatch[2]) {
      displayTime = `${timeMatch[1].trim()} - ${timeMatch[2].trim()}`;
    }
  }
  document.getElementById('eventDetailsTime').textContent = displayTime;

  // Extract amenity
  let displayAmenity = notification.amenity || 'N/A';
  if (!displayAmenity || displayAmenity === 'N/A') {

      const amenityMatch = notification.message.match(/at\s+([A-Za-z]+)/i);

  // 2. Explicit payment indicators
  else if (notification.type === 'payment_required') {

    }

  if (displayDate === 'N/A' || displayTime === 'N/A' || displayAmenity === 'N/A') {

// Add this new function to fetch missing event details
async function fetchEventDetails(notification, eventName) {
  try {
    // First try by relatedId
    let url = `/api/event/${notification.relatedId}`;
    let response = await fetch(url);
    
    // If that fails, try by event name
    if (!response.ok && eventName && eventName !== 'N/A') {
      url = `/api/event-by-name/${encodeURIComponent(eventName)}`;
      response = await fetch(url);
    }
    
    // If still not found, try by user email
    if (!response.ok && notification.username) {
      url = `/api/user-events/${encodeURIComponent(notification.username)}`;
      response = await fetch(url);
    }
    
    if (!response.ok) {
      console.log("Could not fetch event details from server");
      return;
    }
    
    const data = await response.json();
    
    if (!data.success) {
      console.log("Server returned error:", data.message);
      return;
    }
    
    let event = null;
    
    if (data.event) {
      event = data.event;
    } else if (data.events && data.events.length > 0) {
      // If we got multiple events, try to find the one matching our notification
      if (notification.relatedId) {
        event = data.events.find(e => e._id.toString() === notification.relatedId);
      }
      
      // If not found by ID, try by name
      if (!event && eventName && eventName !== 'N/A') {
        event = data.events.find(e => e.eventName === eventName);
      }
      
      // If still not found, just use the most recent one
      if (!event) {
        event = data.events[0];
      }
    }
    
    if (!event) {
      console.log("No event data found");
      return;
    }
    
    console.log("Found event details:", event);
    
    // Update the UI with the fetched data
    if (event.eventDate && document.getElementById('eventDetailsDate').textContent === 'N/A') {
      document.getElementById('eventDetailsDate').textContent = event.eventDate;
    }
    
    if (event.startTime && event.endTime && document.getElementById('eventDetailsTime').textContent === 'N/A') {
      document.getElementById('eventDetailsTime').textContent = `${event.startTime} - ${event.endTime}`;
    }
    
    if (event.amenity && document.getElementById('eventDetailsAmenity').textContent === 'N/A') {
      document.getElementById('eventDetailsAmenity').textContent = event.amenity;
    }
    
    // Update payment requirement based on event data
    if (event.eventType && ['birthday', 'meeting', 'community'].includes(event.eventType.toLowerCase())) {
      // If it's a free event type, remove payment button if it exists
      const actionsDiv = document.getElementById('eventActions');
      if (actionsDiv) {
        actionsDiv.innerHTML = '';
      }
      // Update status if needed
      if (document.getElementById('eventDetailsStatus').textContent === 'Payment Required') {
        document.getElementById('eventDetailsStatus').textContent = 'Confirmed';
      }
    }
    
  } catch (error) {
    console.error("Error fetching event details:", error);
  }
}

function proceedToPayment(notification) {
  // Debug: Print notification and relatedId
  console.log('Proceed to Payment clicked. Notification:', notification);
  const eventId = notification.relatedId || notification._id;
  console.log('Attempting to fetch event with ID:', eventId);

  // Use notification data directly if all details are present
  if (notification.eventName && notification.eventDate && notification.startTime && notification.endTime && notification.amenity) {
    const eventData = {
      eventName: notification.eventName,
      eventDate: notification.eventDate,
      startTime: notification.startTime,
      endTime: notification.endTime,
      amenity: notification.amenity,
      username: notification.username || '',
      _id: eventId || '',
    };
    sessionStorage.setItem('eventData', JSON.stringify(eventData));
    window.location.href = 'payment.html';
    return;
  }

  // Otherwise, try fetching from the server
  if (eventId) {
    const url = `/api/event/${eventId}`;
    console.log('Fetching event from:', url);
    fetch(url)
      .then(response => {
        console.log('Fetch response:', response);
        if (!response.ok) {
          if (notification.eventName) {
            // Try by event name
            const nameUrl = `/api/event-by-name/${encodeURIComponent(notification.eventName)}`;
            console.log('Event not found by ID, trying by name:', nameUrl);
            return fetch(nameUrl);
          }
          throw new Error('Event not found by ID');
        }
        return response.json();
      })
      .then(data => {
        console.log('Event fetch data:', data);
        if (data && data.success && data.event) {
          sessionStorage.setItem('eventData', JSON.stringify(data.event));
          window.location.href = 'payment.html';
        } else if (notification.eventName && notification.eventDate) {
          // Try by event name and date
          const nameDateUrl = `/eventshow?eventName=${encodeURIComponent(notification.eventName)}&eventDate=${encodeURIComponent(notification.eventDate)}`;
          console.log('Trying by event name and date:', nameDateUrl);
          fetch(nameDateUrl)
            .then(resp => resp.json())
            .then(evData => {
              console.log('Event fetch by name and date:', evData);
              if (evData && evData.success && evData.eventDetails) {
                sessionStorage.setItem('eventData', JSON.stringify(evData.eventDetails));
                window.location.href = 'payment.html';
              } else {
                throw new Error('Event not found by name and date');
              }
            })
            .catch(error => {
              alert('Failed to fetch event details. Please contact admin or try again later.');
              console.error('Final event fetch error:', error);
            });
        } else {
          throw new Error('Unknown error');
        }
      })
      .catch(error => {
        alert('Failed to fetch event details. Please contact admin or try again later.');
        console.error('Final event fetch error:', error);
      });
  } else {
    alert('Event ID not found. Please contact admin.');
    console.error('No eventId found in notification:', notification);
  }
}

              if (evData && evData.success && evData.eventDetails) {
                sessionStorage.setItem('eventData', JSON.stringify(evData.eventDetails));
                window.location.href = 'payment.html';
              } else {
                throw new Error('Event not found by name and date');
              }
            })
            .catch(error => {
              alert('Failed to fetch event details. Please contact admin or try again later.');
              console.error('Final event fetch error:', error);
            });
        } else {
          throw new Error('Unknown error');
        }
      })
      .catch(error => {
        alert('Failed to fetch event details. Please contact admin or try again later.');
        console.error('Final event fetch error:', error);
      });
  } else {
    alert('Event ID not found. Please contact admin.');
    console.error('No eventId found in notification:', notification);
  }
};


// Function to clear all notifications
async function clearAllNotifications() {
  console.log("Clearing all notifications");
  try {
    const response = await fetch('/api/clearAllNotifications', {
      method: 'POST',
      credentials: 'include'
    });

    if (response.ok) {
      const result = await response.json();
      if (result.success) {
        notifications = [];
        const notificationCount = document.getElementById('notificationCount');
        if (notificationCount) {
          notificationCount.textContent = '0';
        }
        updateNotificationList();
        updateClearButtons();
      }
    }
  } catch (error) {
    console.error('Error clearing all notifications:', error);
    showErrorMessage('Failed to clear notifications. Please try again.');
  }
}

// Function to clear selected notifications
async function clearSelectedNotifications() {
  console.log("Clearing selected notifications");
  try {
    const checkboxes = document.querySelectorAll('.notification-checkbox:checked');
    if (checkboxes.length === 0) {
      console.log("No notifications selected");
      return;
    }

    const selectedIds = Array.from(checkboxes).map(checkbox => checkbox.dataset.id);
    console.log("Selected notification IDs:", selectedIds);

    const response = await fetch('/api/clearSelectedNotifications', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ notificationIds: selectedIds })
    });

    if (response.ok) {
      const result = await response.json();
      if (result.success) {
        // Remove the cleared notifications from the array
        notifications = notifications.filter(notification => 
          !selectedIds.includes(notification._id)
        );
        
        // Update the notification count
        const notificationCount = document.getElementById('notificationCount');
        if (notificationCount) {
          notificationCount.textContent = notifications.length.toString();
        }
        
        // Update the UI
        updateNotificationList();
        updateClearButtons();
      }
    }
  } catch (error) {
    console.error('Error clearing selected notifications:', error);
    showErrorMessage('Failed to clear selected notifications. Please try again.');
  }
}

// Function to fetch notifications from the server
async function fetchNotifications() {
  try {
    const response = await fetch("/api/notifications", {
      method: "GET",
      credentials: "include",
      headers: {
        Accept: "application/json",
        "Cache-Control": "no-cache, no-store, must-revalidate",
      },
    });

    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }

    const data = await response.json();
    console.log("Fetched notifications:", data);
    notifications = data.notifications || [];
    updateNotificationList();
    updateClearButtons();
  } catch (error) {
    console.error("Detailed error in fetchNotifications:", error);
    showErrorMessage("Failed to load notifications. Please try again.");
  }
}

      });

      closeEventDetails.addEventListener('click', () => {

          eventDetailsModal.style.display = 'none';
        }
      });
    }

    }

    }

      logoutButton.addEventListener('click', async () => {
        try {
          console.log("Logout button clicked");
          const response = await fetch("/api/logout", { 
            method: "POST",
            credentials: "include",
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            }
          });

          console.log("Logout response:", response.status);
          
          if (response.ok) {
            // Clear all local storage
            localStorage.clear();
            sessionStorage.clear();
            
            // Clear any cookies
            document.cookie.split(";").forEach(function(c) { 
              document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            console.log("Logout successful, redirecting to login page");
            window.location.href = "/login.html";
          } else {
            console.error("Logout failed with status:", response.status);
            showCustomAlert("Logout failed. Please try again.");
          }
        } catch (error) {
          console.error("Error during logout:", error);
          showCustomAlert("An error occurred during logout. Please try again.");
        }
      });
    }
    
    // Close modals when clicking outside
    window.addEventListener('click', (event) => {
      if (notificationModal && event.target === notificationModal) {
        notificationModal.style.display = 'none';
      }
      if (eventDetailsModal && event.target === eventDetailsModal) {
        eventDetailsModal.style.display = 'none';
      }
    });
    
    // Initialize admin popup functionality
    const adminButton = document.getElementById("adminbutton");
    const popup = document.getElementById("adminPopup");
    const closePopup = document.getElementById("closePopup");
    const form = document.getElementById("adminForm");
    
    if (adminButton) {
      adminButton.addEventListener("click", () => {
        if (popup) {
          popup.style.display = "flex";
        }
      });
    }
    
    if (closePopup) {
      closePopup.addEventListener("click", () => {
        if (popup) {
          popup.style.display = "none";
          if (form) {
            form.reset();
          }
        }
      });
    }
    
    // Fetch notifications initially
    console.log("Initializing first notification fetch");
    fetchNotifications();
    
    // Set up periodic fetching (every 30 seconds)
    setInterval(fetchNotifications, 30000);
    
  } catch (error) {
    console.error("Error during initialization:", error);
    showErrorMessage("Failed to initialize notification system. Please refresh the page.");
  }
});

document.addEventListener('DOMContentLoaded', function() {
  const paymentsList = document.getElementById('paymentsList');
  const username = localStorage.getItem('username');
  if (!username) {
    paymentsList.innerHTML = '<div class="payments-empty">Please log in to view your payment history.</div>';
    return;
  }
  fetch(`/api/monthly-payments?status=approved&search="${encodeURIComponent(username)}"&limit=100`)
    .then(res => res.json())
    .then(data => {
      if (!data.success || !data.payments || data.payments.length === 0) {
        paymentsList.innerHTML = '<div class="payments-empty">No payments found yet. Your receipts will appear here after you pay your monthly dues.</div>';
        return;
      }
      // Build table
      let html = '<table class="payments-table">';
      html += '<tr><th>Date</th><th>Amount</th><th>Status</th><th>Receipt</th></tr>';
      data.payments.forEach(payment => {
        const date = new Date(payment.timestamp || payment.lastPaymentDate).toLocaleDateString();
        const amount = payment.amount || payment.monthlyDue || payment.MDAmount || '0.00';
        const status = payment.status || 'Paid';
        // Build receipt link with query params for MDR.html
        const receiptUrl = `MDR.html?username=${encodeURIComponent(payment.userName||'')}` +
          `&address=${encodeURIComponent(payment.address||'')}` +
          `&amount=${encodeURIComponent(amount)}` +
          `&period=${encodeURIComponent(payment.period||'')}`;
        html += `<tr>` +
          `<td>${date}</td>` +
          `<td>₱${parseFloat(amount).toLocaleString('en-PH', {minimumFractionDigits:2})}</td>` +
          `<td>${status}</td>` +
          `<td><button class="receipt-btn" onclick="window.open('${receiptUrl}', '_blank')">View Receipt</button></td>` +
          `</tr>`;
      });
      html += '</table>';
      paymentsList.innerHTML = html;
    })
    .catch(err => {
      paymentsList.innerHTML = '<div class="payments-empty">Failed to load payment history. Please try again later.</div>';
    });
    document.getElementById("logoutButton").addEventListener("click", async () => {
          try {
            const response = await fetch("/logout", { method: "POST" });

              window.location.href = "login.html"; // Redirect to the login page
            } else {
              showCustomAlert("Logout failed. Please try again.");
            }
          } catch (error) {
            console.error("Error during logout:", error);
            showCustomAlert("An error occurred during logout. Please try again.");
          }
        });
