    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .reserve {
        display: flex;

        gap: 20%; /* Space between the buttons */

        flex-wrap: wrap; /* Allows buttons to wrap on smaller screens */
      }
 
      .reservetext1 {
        font-size: 40px;
        font-family: "Inter";

      .reserve-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
 
      .reserve button {
        border: 2px solid #3e0408;
        background: transparent;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
 
      .reserve button:hover {
        background-color: #3e0408;
        color: #ffffff;
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
 
      .reserve button img {

      }

        width: 100%;
        text-align: center;
      }

        .search-bar {
          width: 100%;
        }
 
        .top-bar {
          padding: 0 10px;
        }
 
        .reserve {
          flex-direction: column; /* Stack buttons vertically on small screens */
          gap: 20px;
        }
 
        .reservetext1 {
          font-size: 30px; /* Adjust the size for smaller screens */
        }
      }
 
      .popup {
        display: none; /* Hidden by default */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1001;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
      }

      .popup-content {
        background-color: #ffffff; 
        color: #000000; 
        padding: 20px;
        border: 2px solid #af2630; 
        border-radius: 8px;
        width: 900px;
        height: auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        box-sizing: border-box;
        font-family: sans-serif;
        position: relative; 
      }

      .popup-top-bar {
        background-color: #af2630; 
        color: #ffffff; 
        padding: 10px;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        border-top-left-radius: 8px; 
        border-top-right-radius: 8px;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      .popup-content-inner {
        margin-top: 60px; 
      }

      .popup-content label {
        display: block;
        margin: 10px 0 5px;
        font-size: 20px;
        font-weight: bold;
      }

      .popup-content input[type="text"],
      .popup-content textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;

      .popup-buttons {

        border-radius: 5px;

        font-weight: bold;
        font-size: 20px;

      /* Notification Icon Styles */
      .notification-icon {
position: fixed;
        top: 20px;
        right: 20px;
        background: #af2630;
border-radius: 50%;
width: 40px;
height: 40px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;

transition: transform 0.2s;

      .notification-icon:hover {
        transform: scale(1.1);
}

      .notification-icon img {
        width: 24px;

      .notification-count {

        justify-content: center;
        align-items: center;

        border: 2px solid white;

        top: 70px;
        right: 20px;

        border-radius: 10px;

      .notification-header {

        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }

        margin: 0;
        font-size: 18px;
        font-weight: bold;
      }

        color: white;
        font-size: 24px;

        right: 15px;

      }

      .close-modal:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .notification-list {
        overflow-y: auto;
        max-height: 60vh;
        padding: 0;
      }

      .notification-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      
      .notification-item:hover {
        background-color: #f5f5f5;
      }
      
      .notification-checkbox {
        margin-top: 3px;
      }
      
      .notification-content {
        flex: 1;
      }
      
      .notification-subject {
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
      }
      
      .notification-message {
        color: #666;
        margin-bottom: 5px;
        font-size: 14px;
      }
      
      .notification-timestamp {
        font-size: 12px;
        color: #888;
      }
      
      .notification-actions {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        border-top: 1px solid #eee;
        background-color: #f9f9f9;
      }

      .clear-btn {
        background-color: #af2630;

        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s;
      }

      .clear-btn:hover {
        background-color: #8f1d25;
      }

      .clear-btn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .no-notifications {
        padding: 20px;
        text-align: center;
        color: #888;
        font-style: italic;
      }

      /* Add debug styles to make sure elements are visible */
      #notificationIcon {
        border: 2px solid red !important; /* Debug border */
      }

        border: 2px solid blue !important; /* Debug border */
      }

      @media screen and (max-width: 768px) {
        .notification-modal {
          width: 95vw;
          max-height: 80vh;
          top: 10px;
          right: 10px;

        }

          max-height: calc(80vh - 140px);
        }

        }

        }

          font-size: 0.85rem;
        }

  <script>
let notifications = [];
const MAX_RETRIES = 3;
const RETRY_DELAY = 2000;
let retryCount = 0;
let currentNotification = null;

// Add this function to check if elements exist
function checkElements() {
  const elements = {
    notificationIcon: document.getElementById('notificationIcon'),
    notificationModal: document.getElementById('notificationModal'),
    notificationList: document.getElementById('notificationList'),
    logoutButton: document.getElementById('logoutButton')
  };
  
  console.log('Checking elements:', elements);
  return elements;
}

// Update the fetchNotifications function with more debugging
async function fetchNotifications() {
  try {
    console.log("Starting to fetch notifications...");
    const response = await fetch("/api/notifications", {
      method: "GET",
      credentials: "include",
      headers: {
        "Accept": "application/json",
        "Cache-Control": "no-cache"
      }
    });

    console.log("Notification fetch response status:", response.status);
    
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }

    const data = await response.json();
    console.log("Raw notification data:", data);
    
    if (data && Array.isArray(data)) {
      notifications = data;
      console.log("Processed notifications:", notifications);
      
      // Update notification count
      const unreadCount = notifications.filter(n => !n.read).length;
      console.log("Unread count:", unreadCount);
      
      const notificationCount = document.getElementById('notificationCount');
      if (notificationCount) {
        notificationCount.textContent = unreadCount.toString();
        console.log("Updated notification count display");
    } else {
        console.error("Notification count element not found");
      }
      
      updateNotificationList();
      updateClearButtons();
    } else {
      console.error("Invalid notification data received:", data);
      notifications = [];
    }
  } catch (error) {
    console.error("Error fetching notifications:", error);
    showErrorMessage("Failed to load notifications. Please try again.");
    notifications = [];
  }
}

// Add this initialization function
async function initializeApp() {
  try {
    console.log("Starting app initialization...");
    
    // Debug: Log all elements
    console.log("Checking elements:", {
      notificationIcon: document.getElementById('notificationIcon'),
      notificationModal: document.getElementById('notificationModal'),
      notificationList: document.getElementById('notificationList'),
      closeModal: document.getElementById('closeModal'),
      logoutButton: document.getElementById('logoutButton')
    });

    // Check authentication
    const authResponse = await fetch('/api/check-auth', {
      method: 'GET',
      credentials: 'include',
      headers: {
        'Accept': 'application/json',
        'Cache-Control': 'no-cache'
      }
    });

    console.log("Auth response:", authResponse.status);

    if (!authResponse.ok) {
      console.log("Auth check failed, redirecting to login");
      window.location.href = "/login.html";
      return;
    }

    const authData = await authResponse.json();
    console.log("Auth data:", authData);

    if (!authData.authenticated) {
      console.log("Not authenticated, redirecting to login");
      window.location.href = "/login.html";
      return;
    }

    console.log("Authentication successful");
    
    // Initialize notification elements
    const notificationIcon = document.getElementById('notificationIcon');
  const notificationModal = document.getElementById('notificationModal');
    const closeModal = document.getElementById('closeModal');
    const logoutButton = document.getElementById('logoutButton');

    if (!notificationIcon || !notificationModal || !closeModal || !logoutButton) {
      console.error("Required elements not found:", {
        notificationIcon: !!notificationIcon,
        notificationModal: !!notificationModal,
        closeModal: !!closeModal,
        logoutButton: !!logoutButton
      });
      return;
    }

    // Set up notification icon click handler
    notificationIcon.addEventListener('click', async (e) => {
      console.log("Notification icon clicked", e);
      e.preventDefault();
      e.stopPropagation();
      notificationModal.style.display = 'block';
      await fetchNotifications();
    });

    // Set up close modal handler
    closeModal.addEventListener('click', (e) => {
      console.log("Close modal clicked", e);
      e.preventDefault();
      e.stopPropagation();
      notificationModal.style.display = 'none';
    });

    // Set up logout button handler
    logoutButton.addEventListener('click', async (e) => {
      console.log("Logout button clicked", e);
      e.preventDefault();
      e.stopPropagation();
      try {
        const response = await fetch("/api/logout", {
          method: "POST",
          credentials: "include",
      headers: {
        'Content-Type': 'application/json'
      }
    });
    
        console.log("Logout response status:", response.status);
        
        if (response.ok) {
          console.log("Logout successful, clearing data");
          localStorage.clear();
          sessionStorage.clear();
          window.location.href = "/login.html";
        } else {
          console.error("Logout failed");
          alert("Logout failed. Please try again.");
    }
  } catch (error) {
        console.error("Error during logout:", error);
        alert("An error occurred during logout. Please try again.");
      }
    });

    // Add test button handler
    const testButton = document.getElementById('testNotification');
    if (testButton) {
        testButton.addEventListener('click', async () => {
            console.log("Test button clicked");
  const notificationModal = document.getElementById('notificationModal');
  if (notificationModal) {
                console.log("Showing modal");
                notificationModal.style.display = 'block';
                await fetchNotifications();
            } else {
                console.error("Modal not found");
            }
        });
    }

    // Initial fetch of notifications
    console.log("Performing initial notification fetch");
    await fetchNotifications();

  } catch (error) {
    console.error("Error during initialization:", error);
    window.location.href = "/login.html";
  }
}

// Call the initialization function when the DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
  console.log("DOM Content Loaded - Starting initialization");
  initializeApp();
});

// Add this to help debug notification clicks
function updateNotificationList() {
  console.log("Updating notification list");
  const notificationList = document.getElementById('notificationList');
  if (!notificationList) {
    console.error('Notification list element not found');
      return;
    }
    
  notificationList.innerHTML = ''; // Clear existing list

  if (!notifications || notifications.length === 0) {
    console.log("No notifications to display");
    const noNotifications = document.createElement('div');
    noNotifications.classList.add('no-notifications');
    noNotifications.textContent = 'No new notifications';
    notificationList.appendChild(noNotifications);
      return;
    }
    
  console.log("Rendering notifications:", notifications);

  notifications.forEach((notification) => {
    console.log("Creating notification item for:", notification);
    const notificationItem = document.createElement('div');
    notificationItem.classList.add('notification-item');
    notificationItem.dataset.id = notification._id;
    
    // Create checkbox
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'notification-checkbox';
    checkbox.dataset.id = notification._id;
    checkbox.onclick = (e) => e.stopPropagation();

    // Create content wrapper
    const contentWrapper = document.createElement('div');
    contentWrapper.className = 'notification-content';
    
    // Create subject line
    const subjectDiv = document.createElement('div');
    subjectDiv.className = 'notification-subject';
    subjectDiv.textContent = notification.subject || 'Notification';

    // Create message element
    const messageDiv = document.createElement('div');
    messageDiv.className = 'notification-message';
    messageDiv.textContent = notification.message;

    // Create timestamp element
    const timestampDiv = document.createElement('div');
    timestampDiv.className = 'notification-timestamp';
    timestampDiv.textContent = new Date(notification.timestamp.$date).toLocaleString();

    // Add elements to content wrapper
    contentWrapper.appendChild(subjectDiv);
    contentWrapper.appendChild(messageDiv);
    contentWrapper.appendChild(timestampDiv);

    // Add elements to notification item
    notificationItem.appendChild(checkbox);
    notificationItem.appendChild(contentWrapper);

    // Add click event
    notificationItem.addEventListener('click', (e) => {
      console.log("Notification clicked:", notification);
      if (e.target !== checkbox) {
        switch (notification.type) {
          case 'payment_reminder':
            showPaymentReminderModal(notification);
            break;
          default:
            showDefaultModal(notification);
        }
      }
    });

    notificationList.appendChild(notificationItem);
  });
}

// Function to update the clear buttons state
function updateClearButtons() {
  console.log("Updating clear buttons");
  const clearSelectedBtn = document.getElementById('clearSelectedBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');

  if (!clearSelectedBtn || !clearAllBtn) {
    console.error('Clear buttons not found');
    return; // Buttons not found
  }

  if (notifications.length === 0) {
    clearSelectedBtn.disabled = true;
    clearAllBtn.disabled = true;
    clearSelectedBtn.style.opacity = '0.5';
    clearAllBtn.style.opacity = '0.5';
  } else {
    clearSelectedBtn.disabled = false;
    clearAllBtn.disabled = false;
    clearSelectedBtn.style.opacity = '1';
    clearAllBtn.style.opacity = '1';
  }
}

function handleNoNotifications() {

  const notificationCountElement = document.getElementById('notificationCount');

    notificationCountElement.textContent = '0';

// Function to show error messages
function showErrorMessage(message) {
  console.error('Error message:', message);
  const errorDiv = document.createElement('div');
  errorDiv.textContent = message;
  errorDiv.style.color = 'red';
  errorDiv.style.padding = '10px';
  errorDiv.style.marginTop = '10px';
  errorDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.1)';
  errorDiv.style.border = '1px solid red';
  errorDiv.style.borderRadius = '5px';

  // Find a good place to add the error message
  const notificationList = document.getElementById('notificationList');
  if (notificationList) {
    notificationList.prepend(errorDiv);
  } else {
    document.body.appendChild(errorDiv);
  }

  setTimeout(() => {
    if (errorDiv.parentNode) {
      errorDiv.parentNode.removeChild(errorDiv);
    }
  }, 5000); // Remove after 5 seconds
}

function proceedToPayment(notification) {
  // Debug: Print notification and relatedId
  console.log('Proceed to Payment clicked. Notification:', notification);
  const eventId = notification.relatedId || notification._id;
  console.log('Attempting to fetch event with ID:', eventId);

  // Use notification data directly if all details are present
  if (notification.eventName && notification.eventDate && notification.startTime && notification.endTime && notification.amenity) {
    const eventData = {
      eventName: notification.eventName,
      eventDate: notification.eventDate,
      startTime: notification.startTime,
      endTime: notification.endTime,
      amenity: notification.amenity,
      username: notification.username || '',
      _id: eventId || '',
    };
    sessionStorage.setItem('eventData', JSON.stringify(eventData));
    window.location.href = 'payment.html';
    return;
  }

  // Otherwise, try fetching from the server
  if (eventId) {
    const url = `/api/event/${eventId}`;
    console.log('Fetching event from:', url);
    fetch(url)
      .then(response => {
        console.log('Fetch response:', response);
        if (!response.ok) {
          if (notification.eventName) {
            // Try by event name
            const nameUrl = `/api/event-by-name/${encodeURIComponent(notification.eventName)}`;
            console.log('Event not found by ID, trying by name:', nameUrl);
            return fetch(nameUrl);
          }
          throw new Error('Event not found by ID');
        }
        return response.json();
      })
      .then(data => {
        console.log('Event fetch data:', data);
        if (data && data.success && data.event) {
          sessionStorage.setItem('eventData', JSON.stringify(data.event));
          window.location.href = 'payment.html';
        } else if (notification.eventName && notification.eventDate) {
          // Try by event name and date
          const nameDateUrl = `/eventshow?eventName=${encodeURIComponent(notification.eventName)}&eventDate=${encodeURIComponent(notification.eventDate)}`;
          console.log('Trying by event name and date:', nameDateUrl);
          fetch(nameDateUrl)
            .then(resp => resp.json())
            .then(evData => {
              console.log('Event fetch by name and date:', evData);
              if (evData && evData.success && evData.eventDetails) {
                sessionStorage.setItem('eventData', JSON.stringify(evData.eventDetails));
                window.location.href = 'payment.html';
              } else {
                throw new Error('Event not found by name and date');
              }
            })
            .catch(error => {
              alert('Failed to fetch event details. Please contact admin or try again later.');
              console.error('Final event fetch error:', error);
            });
        } else {
          throw new Error('Unknown error');
        }
      })
      .catch(error => {
        alert('Failed to fetch event details. Please contact admin or try again later.');
        console.error('Final event fetch error:', error);
      });
  } else {
    alert('Event ID not found. Please contact admin.');
    console.error('No eventId found in notification:', notification);
  }
}

// Function to clear all notifications
async function clearAllNotifications() {
  console.log("Clearing all notifications");
  try {
    const response = await fetch('/api/clearAllNotifications', {
      method: 'POST',
      credentials: 'include'
    });

    if (response.ok) {
      const result = await response.json();
      if (result.success) {
        notifications = [];
        const notificationCount = document.getElementById('notificationCount');
        if (notificationCount) {
          notificationCount.textContent = '0';
        }
        updateNotificationList();
        updateClearButtons();
      }
    }
  } catch (error) {
    console.error('Error clearing all notifications:', error);
    showErrorMessage('Failed to clear notifications. Please try again.');
  }
}

// Function to clear selected notifications
async function clearSelectedNotifications() {
  console.log("Clearing selected notifications");
  try {
    const checkboxes = document.querySelectorAll('.notification-checkbox:checked');
    if (checkboxes.length === 0) {
      console.log("No notifications selected");
      return;
    }

    const selectedIds = Array.from(checkboxes).map(checkbox => checkbox.dataset.id);
    console.log("Selected notification IDs:", selectedIds);

    const response = await fetch('/api/clearSelectedNotifications', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ notificationIds: selectedIds })
    });

    if (response.ok) {
      const result = await response.json();
      if (result.success) {
        // Remove the cleared notifications from the array
        notifications = notifications.filter(notification => 
          !selectedIds.includes(notification._id)
        );
        
        // Update the notification count
        const notificationCount = document.getElementById('notificationCount');
        if (notificationCount) {
          notificationCount.textContent = notifications.length.toString();
        }
        
        // Update the UI
        updateNotificationList();
        updateClearButtons();
      }
    }
  } catch (error) {
    console.error('Error clearing selected notifications:', error);
    showErrorMessage('Failed to clear selected notifications. Please try again.');
  }
}

// --- Payments Section Logic ---
document.addEventListener('DOMContentLoaded', function() {
  const paymentsList = document.getElementById('paymentsList');
  const username = localStorage.getItem('username');
  if (!username) {
    paymentsList.innerHTML = '<div class="payments-empty">Please log in to view your payment history.</div>';
    return;
  }
  fetch(`/api/monthly-payments?status=approved&search="${encodeURIComponent(username)}"&limit=100`)
    .then(res => res.json())
    .then(data => {
      if (!data.success || !data.payments || data.payments.length === 0) {
        paymentsList.innerHTML = '<div class="payments-empty">No payments found yet. Your receipts will appear here after you pay your monthly dues.</div>';
        return;
      }
      // Build table
      let html = '<table class="payments-table">';
      html += '<tr><th>Date</th><th>Amount</th><th>Status</th><th>Receipt</th></tr>';
      data.payments.forEach(payment => {
        const date = new Date(payment.timestamp || payment.lastPaymentDate).toLocaleDateString();
        const amount = payment.amount || payment.monthlyDue || payment.MDAmount || '0.00';
        const status = payment.status || 'Paid';
        // Build receipt link with query params for MDR.html
        const receiptUrl = `MDR.html?username=${encodeURIComponent(payment.userName||'')}` +
          `&address=${encodeURIComponent(payment.address||'')}` +
          `&amount=${encodeURIComponent(amount)}` +
          `&period=${encodeURIComponent(payment.period||'')}`;
        html += `<tr>` +
          `<td>${date}</td>` +
          `<td>₱${parseFloat(amount).toLocaleString('en-PH', {minimumFractionDigits:2})}</td>` +
          `<td>${status}</td>` +
          `<td><button class="receipt-btn" onclick="window.open('${receiptUrl}', '_blank')">View Receipt</button></td>` +
          `</tr>`;
      });
      html += '</table>';
      paymentsList.innerHTML = html;
    })
    .catch(err => {
      paymentsList.innerHTML = '<div class="payments-empty">Failed to load payment history. Please try again later.</div>';
    });
    document.getElementById("logoutButton").addEventListener("click", async () => {
          try {
            const response = await fetch("/logout", { method: "POST" });
            if (response.ok) {
              localStorage.clear(); // Clear user data
              window.location.href = "login.html"; // Redirect to the login page
            } else {
              showCustomAlert("Logout failed. Please try again.");
            }
          } catch (error) {
            console.error("Error during logout:", error);
            showCustomAlert("An error occurred during logout. Please try again.");
          }
        });
});
