<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized Access</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f8f8;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .logo {
            width: 200px;
            margin-bottom: 2rem;
        }

        h1 {
            color: #AF2630;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #AF2630;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #8f1d25;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../images/AvidaSettingsLogo.png" alt="Avida Settings Logo" class="logo" onerror="this.onerror=null; this.src='/images/placeholder.png';">
        <h1>Unauthorized Access</h1>
        <p>You do not have permission to access this page. This area is restricted to administrators only.</p>
        <p>You will be redirected to the homeowner dashboard.</p>
        <a href="/HoHome.html" class="button" id="redirectButton">Return to Dashboard</a>
    </div>

    <script>
        // Check if we've already handled this unauthorized access
        if (sessionStorage.getItem('handlingUnauthorized')) {
            // If we're already handling it, just redirect to home
            window.location.href = '/HoHome.html';
        } else {
            // Mark that we're handling the unauthorized access
            sessionStorage.setItem('handlingUnauthorized', 'true');
            
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    // Attempt to logout first
                    const response = await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Logout failed');
                    }
                    
                    // Clear storage after successful logout
                    localStorage.clear();
                    sessionStorage.clear();
                    
                    // Auto-redirect after 5 seconds
                    setTimeout(() => {
                        window.location.href = '/HoHome.html';
                    }, 5000);

                    // Update button text with countdown
                    let seconds = 5;
                    const button = document.getElementById('redirectButton');
                    const interval = setInterval(() => {
                        seconds--;
                        if (seconds > 0) {
                            button.textContent = `Return to Dashboard (${seconds})`;
                        } else {
                            clearInterval(interval);
                        }
                    }, 1000);
                    
                } catch (error) {
                    console.error('Error during logout:', error);
                    // Even if logout fails, redirect to home
                    window.location.href = '/HoHome.html';
                }
            });
        }
    </script>
</body>
</html>
